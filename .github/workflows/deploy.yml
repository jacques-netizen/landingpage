name: Deploy to Cloudflare Workers

# Free workaround for the paused managed builds: this deploys straight to
# Cloudflare from GitHub's free runners using the Cloudflare API, instead of
# Cloudflare's own build service.
#
# Requires two GitHub repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN   - an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID

on:
  push:
    branches: [claude/beautiful-franklin-kl5mvv]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
