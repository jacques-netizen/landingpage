name: guide CI

on:
  push:
    paths: ["guide/**", ".github/workflows/guide-ci.yml"]
  pull_request:
    paths: ["guide/**", ".github/workflows/guide-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:dashes
