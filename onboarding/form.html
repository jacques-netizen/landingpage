<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Onboarding · Maison d'Élites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Served at /onboarding/<token>, on maisondelites.com through a Cloudflare
     route. Everything it loads is inline or an absolute URL, and every API call
     goes to /onboarding/api/..., so it works on any host the Worker answers. -->
<style>
  :root{
    --ink:#14110D; --bg:#F4EEE2; --surface:#FBF7EE; --surface-2:#EFE7D7;
    --text:#221D15; --muted:#7A7163;
    --line:rgba(20,17,13,.13); --line-strong:rgba(20,17,13,.24);
    --gold:#9A7B36; --gold-bright:#B9923F;
    --field-bg:#FFFFFF; --field-line:rgba(20,17,13,.18);
    --hero-bg:#14110D; --hero-text:#F4EEE2; --hero-gold:#C7A867;
    --danger:#9A3B2A; --ok:#3F7A4F; --on-gold:#fff;
    --shadow:0 22px 55px rgba(20,17,13,.12);
    --serif:'EB Garamond', Garamond, 'Times New Roman', serif;
    --sans:'Archivo', system-ui, -apple-system, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#0C0A07; --bg:#100E0A; --surface:#191510; --surface-2:#20190F;
      --text:#EFE7D5; --muted:#9E9278;
      --line:rgba(199,168,103,.15); --line-strong:rgba(199,168,103,.30);
      --gold:#C7A867; --gold-bright:#E1BF73;
      --field-bg:#141009; --field-line:rgba(199,168,103,.24);
      --hero-bg:#0A0906; --danger:#E58C77; --ok:#8FCBA0; --on-gold:#1b1407;
      --shadow:0 22px 55px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#0C0A07; --bg:#100E0A; --surface:#191510; --surface-2:#20190F;
    --text:#EFE7D5; --muted:#9E9278;
    --line:rgba(199,168,103,.15); --line-strong:rgba(199,168,103,.30);
    --gold:#C7A867; --gold-bright:#E1BF73;
    --field-bg:#141009; --field-line:rgba(199,168,103,.24);
    --hero-bg:#0A0906; --danger:#E58C77; --ok:#8FCBA0; --on-gold:#1b1407;
    --shadow:0 22px 55px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:300; line-height:1.65;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  [hidden]{display:none!important}

  .topbar{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:saturate(140%) blur(10px); border-bottom:1px solid var(--line)}
  .progress-track{height:3px}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .5s cubic-bezier(.4,0,.1,1)}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 16px; max-width:900px; margin:0 auto}
  .wordmark{font-family:var(--serif); font-size:1.05rem; color:var(--text); display:flex; align-items:center; gap:9px; min-width:0}
  .wordmark b{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wordmark .mark{font-family:var(--sans); font-weight:600; font-size:9.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); white-space:nowrap}
  .wordmark .txt{display:flex; align-items:baseline; gap:8px; min-width:0}
  .crest{color:var(--gold); flex:none; width:26px; height:26px}
  .stepcount{font-weight:500; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  @media (max-width:420px){ .wordmark .mark{display:none} }

  .wrap{max-width:640px; margin:0 auto; padding:0 16px}
  .stage{padding-block:44px 150px; animation:rise .45s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .stage{animation:none} .progress-fill{transition:none} }

  .eyebrow{font-weight:600; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:10px}
  .eyebrow .bar{flex:1; height:1px; background:var(--line-strong); max-width:60px}
  h1.q{font-family:var(--serif); font-weight:500; font-size:clamp(1.75rem,5.6vw,2.4rem); line-height:1.12; letter-spacing:-.01em; margin:18px 0 0; text-wrap:balance}
  .help{font-family:var(--serif); font-size:1.12rem; line-height:1.5; color:var(--muted); margin:10px 0 0; max-width:46ch}
  .opt-tag{font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-left:6px; vertical-align:middle}
  .body{margin-top:30px; display:flex; flex-direction:column; gap:16px}

  label.mini{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:.02em}
  input[type=text], input[type=email], input[type=url], input[type=tel], input[type=date], textarea{
    width:100%; font-family:var(--sans); font-weight:300; font-size:16px; line-height:1.55;
    color:var(--text); background:var(--field-bg); border:1px solid var(--field-line); border-radius:8px; padding:13px 15px;
    transition:border-color .18s, box-shadow .18s; resize:vertical; -webkit-appearance:none; appearance:none}
  input[type=date]{min-height:50px}
  textarea{min-height:150px}
  input::placeholder, textarea::placeholder{color:color-mix(in srgb, var(--muted) 72%, transparent)}
  input:focus, textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent)}
  input:disabled{opacity:.45}
  .err{color:var(--danger); font-size:13px; margin-top:2px; min-height:0}
  .err:empty{display:none}
  .invalid input, .invalid textarea, input.invalid{border-color:var(--danger)}

  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; font-family:var(--sans); font-size:15.5px; font-weight:400; color:var(--text);
    background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; padding:14px 16px; cursor:pointer; transition:.16s}
  .opt:hover{border-color:var(--gold)}
  .opt .box{flex:none; width:20px; height:20px; border:1.5px solid var(--line-strong); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--on-gold)}
  .opt.multi .box{border-radius:5px}
  .opt[aria-pressed="true"]{border-color:var(--gold); background:color-mix(in srgb, var(--gold) 9%, var(--surface))}
  .opt[aria-pressed="true"] .box{background:var(--gold); border-color:var(--gold)}
  .opt:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 26%, transparent)}

  .row{display:flex; gap:9px; align-items:flex-start}
  .row > *{flex:1; min-width:0}
  .row .iconbtn{flex:none}
  @media (max-width:480px){ .row.stack{flex-direction:column} .row.stack > *{width:100%} }
  .iconbtn{width:44px; height:50px; border-radius:8px; border:1px solid var(--line-strong); background:transparent; color:var(--muted); font-size:20px; line-height:1; cursor:pointer}
  .iconbtn:hover{color:var(--danger); border-color:var(--danger)}
  .addbtn{align-self:flex-start; background:transparent; border:1px dashed var(--line-strong); color:var(--gold); font-family:var(--sans); font-weight:500; font-size:13px; padding:11px 16px; border-radius:8px; cursor:pointer}
  .addbtn:hover{border-color:var(--gold)}
  .check{display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--text); cursor:pointer; user-select:none}
  .check input{width:19px; height:19px; accent-color:var(--gold); margin:0}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
  .card + .card{margin-top:0}
  .src-h{font-weight:600; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-bottom:10px}

  /* uploads */
  .drop{border:1.5px dashed var(--line-strong); border-radius:12px; padding:26px 16px; text-align:center; cursor:pointer; background:var(--surface); transition:.16s; position:relative}
  .drop:hover, .drop.over{border-color:var(--gold); background:color-mix(in srgb,var(--gold) 6%, var(--surface))}
  .drop b{display:block; font-family:var(--serif); font-weight:500; font-size:1.2rem; color:var(--text)}
  .drop span{font-size:12.5px; color:var(--muted)}
  .drop input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%}
  .files{display:flex; flex-direction:column; gap:8px; margin-top:4px}
  .file{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface)}
  .file .meta{flex:1; min-width:0}
  .file .nm{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .file .sz{font-size:11.5px; color:var(--muted)}
  .file .bar{height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden}
  .file .bar i{display:block; height:100%; width:0; background:var(--gold); transition:width .2s}
  .file .x{flex:none; background:none; border:1px solid var(--line-strong); color:var(--muted); width:32px; height:32px; border-radius:7px; cursor:pointer; font-size:16px}
  .file .x:hover{color:var(--danger); border-color:var(--danger)}
  .file.failed .sz{color:var(--danger)}

  /* hero */
  .hero{background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--hero-gold) 14%, transparent), transparent 60%), var(--hero-bg); color:var(--hero-text); border-radius:16px; padding:44px 24px 38px; text-align:center; box-shadow:var(--shadow); border:1px solid color-mix(in srgb,var(--hero-gold) 20%, transparent)}
  .hero .eyebrow{justify-content:center; color:var(--hero-gold)}
  .hero .eyebrow .bar{background:color-mix(in srgb,var(--hero-gold) 40%, transparent)}
  .hero h1{font-family:var(--serif); font-weight:500; font-size:clamp(2.1rem,7vw,3.1rem); line-height:1.05; margin:18px 0 0}
  .hero h1 em{font-style:italic; color:var(--hero-gold)}
  .hero p{font-family:var(--serif); font-size:clamp(1.08rem,2.7vw,1.24rem); line-height:1.55; color:color-mix(in srgb,var(--hero-text) 82%, transparent); max-width:40ch; margin:16px auto 0}
  .hero .btn{margin-top:28px}

  /* nav */
  .navbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:color-mix(in srgb,var(--bg) 92%, transparent); backdrop-filter:saturate(140%) blur(12px); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .navbar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:10px}
  .savenote{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:7px; margin-right:auto; min-width:0}
  .savenote .tick{width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none}
  .savenote.warn .tick{background:var(--danger)}
  .btn{font-family:var(--sans); font-weight:500; font-size:14.5px; border-radius:10px; padding:13px 24px; cursor:pointer; border:1px solid transparent; transition:.18s; display:inline-flex; align-items:center; justify-content:center; gap:9px; white-space:nowrap}
  .btn-primary{background:var(--gold); color:var(--on-gold); border-color:var(--gold)}
  .btn-primary:hover{background:var(--gold-bright); border-color:var(--gold-bright)}
  .btn-ghost{background:transparent; color:var(--muted); border-color:var(--line-strong)}
  .btn-ghost:hover{color:var(--text); border-color:var(--text)}
  .btn:disabled{opacity:.55; cursor:not-allowed}
  .hero .btn-primary{color:#1b1407; background:var(--hero-gold); border-color:var(--hero-gold); padding:14px 40px}

  /* review */
  .rev-sec{border-top:1px solid var(--line); padding:20px 0}
  .rev-sec:first-child{border-top:none; padding-top:4px}
  .rev-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
  .rev-head h3{font-family:var(--serif); font-weight:500; font-size:1.35rem; margin:0}
  .rev-edit{font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); background:none; border:none; cursor:pointer; padding:6px}
  .rev-item{padding:7px 0}
  .rev-item .rl{font-size:12px; color:var(--muted)}
  .rev-item .rv{font-family:var(--serif); font-size:1.08rem; line-height:1.5; white-space:pre-wrap; word-break:break-word}
  .rev-item .rv.empty{color:color-mix(in srgb,var(--muted) 70%, transparent); font-style:italic}

  /* booking + done */
  .cal{margin-top:24px; min-height:560px; border-radius:12px; overflow:hidden; background:var(--surface); border:1px solid var(--line)}
  .later{margin-top:18px; text-align:center; font-size:13.5px}
  .later button{background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font:inherit; padding:8px}
  .later button:hover{color:var(--text)}
  .done{text-align:center; padding-top:10px}
  .seal{width:76px; height:76px; margin:0 auto 24px; border-radius:50%; background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--hero-gold) 30%, var(--hero-bg)), var(--hero-bg)); border:1px solid color-mix(in srgb,var(--gold) 45%, transparent); display:flex; align-items:center; justify-content:center; color:var(--hero-gold); font-size:32px; box-shadow:var(--shadow)}
  .done h1{font-family:var(--serif); font-weight:500; font-size:clamp(2rem,6vw,2.7rem); margin:0}
  .done p{font-family:var(--serif); font-size:1.14rem; color:var(--muted); max-width:40ch; margin:14px auto 0; line-height:1.55}
  .notice{margin:26px auto 0; max-width:460px; background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; padding:18px; font-size:14.5px}
  .notice .btn{margin-top:12px}
  details.answers{margin-top:40px; text-align:left; border-top:1px solid var(--line); padding-top:18px}
  details.answers summary{cursor:pointer; font-weight:600; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); list-style:none; text-align:center}
  details.answers summary::-webkit-details-marker{display:none}
  .msg{text-align:center; padding:80px 10px; font-family:var(--serif); font-size:1.25rem; color:var(--muted)}
  .msg h1{font-weight:500; color:var(--text); font-size:2rem; margin:0 0 10px}
  .banner-err{background:color-mix(in srgb,var(--danger) 12%, transparent); color:var(--danger); border:1px solid color-mix(in srgb,var(--danger) 30%, transparent); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-top:18px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    <div class="topbar-row">
      <span class="wordmark">
        <svg class="crest" viewBox="0 0 64 64" aria-hidden="true" fill="none"><circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.2"/><circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="0.6" opacity="0.5"/><text x="32" y="41.5" text-anchor="middle" font-family="EB Garamond, serif" font-size="27" font-style="italic" fill="currentColor">M</text><text x="43.5" y="27" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" font-style="italic" fill="currentColor">é</text></svg>
        <span class="txt"><span class="mark">Maison d'Élites</span> <b id="brandName">Onboarding</b></span>
      </span>
      <span class="stepcount" id="stepcount"></span>
    </div>
  </div>

  <div class="wrap"><div class="stage" id="stage"><div class="msg">Loading…</div></div></div>

  <div class="navbar" id="navbar" hidden>
    <div class="navbar-inner">
      <span class="savenote" id="savenote" hidden><span class="tick"></span><span id="savetext">Saved</span></span>
      <button class="btn btn-ghost" id="backBtn" type="button">Back</button>
      <button class="btn btn-ghost" id="reviewBtn" type="button" hidden>Review</button>
      <button class="btn btn-primary" id="nextBtn" type="button">Continue</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var TOKEN = location.pathname.split('/').filter(Boolean)[1] || '';
  var API = '/onboarding/api/s/' + encodeURIComponent(TOKEN);
  var CHUNK = 10 * 1024 * 1024;
  var MB = 1024 * 1024;
  var TYPES = { png:50, jpg:50, jpeg:50, svg:50, webp:50, pdf:50, zip:50, mp4:2048, mov:2048 };
  var ACCEPT = '.png,.jpg,.jpeg,.svg,.webp,.pdf,.zip,.mp4,.mov';

  var SECTIONS = ['About you', 'What we’re promoting', 'The content', 'Where it runs', 'Wrap-up'];
  var L = {
    contact: [['whatsapp','WhatsApp'],['instagram','Instagram DM'],['email','Email']],
    promo: [['song','A song or album'],['product','A product'],['show','A show or podcast'],['person','A person or personal brand'],['other','Something else']],
    yesno: [['yes','Yes'],['no','No']],
    wins: [['streams','More streams'],['followers','More followers'],['sales','More sales'],['signups','More sign-ups'],['awareness','More people knowing the name'],['other','Something else']],
    sources: [['youtube','YouTube channel'],['podcast','Podcast episodes'],['stream','Twitch or Kick streams'],['drive','A Google Drive or Dropbox folder'],['upload','I’ll upload files here']],
    platforms: [['tiktok','TikTok'],['reels','Instagram Reels'],['shorts','YouTube Shorts'],['x','X']]
  };
  var SRC_FIELD = {
    youtube: ['YouTube channel link', 'https://youtube.com/@yourchannel'],
    podcast: ['Podcast link', 'https://open.spotify.com/show/…'],
    stream: ['Twitch or Kick channel link', 'https://twitch.tv/yourchannel'],
    drive: ['Google Drive or Dropbox folder link', 'https://drive.google.com/drive/folders/…']
  };

  var A = {};            // answers, keyed by question id
  var FILES = [];        // uploaded files from the server [{id,qid,name,size}]
  var UP = [];           // uploads in progress [{qid,name,size,pct,failed,xhr}]
  var S = {};            // server state
  var cur = 'welcome';   // current screen id
  var fromReview = false;
  var saveFailed = false;

  // ---------- helpers ----------
  function $(s, r){ return (r || document).querySelector(s); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function el(tag, attrs, html){ var e = document.createElement(tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
  function label(list, v){ for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i][1]; return v; }
  function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim()); }
  function isUrl(v){ return /^https?:\/\/[^\s.]+\.[^\s]+$/i.test(String(v || '').trim()); }
  function isPhone(v){ return /^\+\d[\d\s().-]{6,}$/.test(String(v || '').trim()); }
  function fixUrl(v){ v = String(v || '').trim(); if (v && !/^https?:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+(\/|$)/.test(v)) v = 'https://' + v; return v; }
  function arr(v){ return Array.isArray(v) ? v : []; }
  function obj(v){ return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  function size(n){ return n >= MB ? (n / MB).toFixed(n >= 100 * MB ? 0 : 1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function clientEmail(){ return (A.q3 === 'email' ? A.q3b : A.q4) || ''; }
  function filesFor(q){ return FILES.filter(function(f){ return f.qid === q; }); }
  function api(path, opts){
    return fetch(API + path, opts || {}).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ j._status = r.status; return j; });
    });
  }
  function post(path, body){ return api(path, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) }); }

  // ---------- screens ----------
  // One question per screen. `show` hides conditional questions; `check`
  // returns an error message (or '') and blocks Continue when required.
  var SCREENS = [
    { id:'q1', sec:0, req:true, q:'What name should this campaign run under?', help:'Company, artist or brand.', type:'text',
      check:function(){ return String(A.q1 || '').trim() ? '' : 'Please add the campaign name'; } },
    { id:'q2', sec:0, req:true, q:'What’s your name and role?', type:'namerole',
      check:function(){ var v = obj(A.q2); return (String(v.name||'').trim() && String(v.role||'').trim()) ? '' : 'Please add your name and role'; } },
    { id:'q3', sec:0, req:true, q:'What’s the best way to reach you day to day?', type:'single', opts:L.contact,
      check:function(){ return A.q3 ? '' : 'Please pick one'; } },
    { id:'q3b', sec:0, req:true, show:function(){ return !!A.q3; }, type:'contact',
      check:function(){
        var v = String(A.q3b || '').trim();
        if (A.q3 === 'whatsapp') return isPhone(v) ? '' : 'Please add your number with country code, e.g. +44 7700 900123';
        if (A.q3 === 'instagram') return v ? '' : 'Please add your Instagram handle';
        return isEmail(v) ? '' : 'Please add a valid email address';
      } },

  // Chunked upload: create -> 10 MB parts (each with progress, retried) -> complete.
  function startUpload(qid, file){
    var ext = (file.name.toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
    var u = { qid: qid, name: file.name, size: file.size, pct: 0 };
    UP.push(u);
    if (!TYPES[ext]) u.failed = 'That file type isn’t accepted';
    else if (file.size > TYPES[ext] * MB) u.failed = TYPES[ext] > 50 ? 'Videos can be up to 2 GB' : 'Files can be up to 50 MB';
    else if (!file.size) u.failed = 'This file is empty';
    drawFiles(qid);
    if (u.failed) return;
    var key, uploadId, parts = [], n = Math.ceil(file.size / CHUNK), done = 0;
    function part(i, tries){
      if (u.cancelled) return Promise.reject(new Error('cancelled'));
      return new Promise(function(res, rej){
        var blob = file.slice(i * CHUNK, Math.min(file.size, (i + 1) * CHUNK));
        var x = new XMLHttpRequest(); u.xhr = x;
        x.open('POST', API + '/upload?action=part&key=' + encodeURIComponent(key) + '&uploadId=' + encodeURIComponent(uploadId) + '&part=' + (i + 1));
        x.upload.onprogress = function(e){ u.pct = Math.min(99, Math.floor((done + e.loaded) / file.size * 100)); updateRow(u); };
        x.onload = function(){
          var j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
          if (x.status === 200 && j.etag) { done += blob.size; parts.push({ partNumber: j.partNumber, etag: j.etag }); res(); }
          else rej(new Error(j.error || 'Upload failed'));
        };
        x.onerror = function(){ rej(new Error('Network error')); };
        x.onabort = function(){ rej(new Error('cancelled')); };
        x.send(blob);
      }).catch(function(err){
        if (u.cancelled || tries >= 3) throw err;
        return new Promise(function(r){ setTimeout(r, 1500 * (tries + 1)); }).then(function(){ return part(i, tries + 1); });
      });
    }
    api('/upload?action=create&q=' + qid + '&name=' + encodeURIComponent(file.name) + '&size=' + file.size, { method:'POST' })
      .then(function(j){
        if (!j.uploadId) throw new Error(j.error || 'Upload failed');
        key = j.key; uploadId = j.uploadId;
        var chain = Promise.resolve();
        for (var i = 0; i < n; i++) (function(i){ chain = chain.then(function(){ return part(i, 0); }); })(i);
        return chain;
      })
      .then(function(){ return post('/upload?action=complete&key=' + encodeURIComponent(key) + '&uploadId=' + encodeURIComponent(uploadId), { parts: parts }); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || 'Upload failed');
        UP.splice(UP.indexOf(u), 1);
        FILES.push({ id: j.id, qid: qid, name: file.name, size: j.size });
        drawFiles(qid);
      })
      .catch(function(err){
        if (u.cancelled) return;
        if (key && uploadId) api('/upload?action=abort&key=' + encodeURIComponent(key) + '&uploadId=' + encodeURIComponent(uploadId), { method:'POST' });
        u.failed = (err && err.message) || 'Upload failed';
        drawFiles(qid);
      });
  }

  function display(id){

    switch (id) {

      case 'q3': return label(L.contact, v);
      case 'q5': return arr(v).map(function(p){ return [p.name, p.email].filter(Boolean).join(' · '); }).join('\n');
      case 'q6': return v === 'other' ? 'Something else: ' + (A.q6_other || '') : label(L.promo, v);
      case 'q7': return label(L.yesno, v);
      case 'q9': v = obj(v); return v.none ? 'No set date' : [v.date, v.what].filter(Boolean).join(' · ');
      case 'q10': return arr(v).map(function(x){ return x === 'other' ? 'Something else: ' + (A.q10_other || '') : label(L.wins, x); }).join('\n');
      case 'q11': return arr(v).map(function(x){ return label(L.sources, x); }).join('\n');
      case 'q11b':
        var lines = arr(A.q11).filter(function(s){ return s !== 'upload'; }).map(function(s){ return SRC_FIELD[s][0] + ': ' + (obj(v)[s] || ''); });
        filesFor('q11b').forEach(function(f){ lines.push('File: ' + f.name); });
        return lines.join('\n');
      case 'q14': v = obj(v); return [['sound','Sound'],['hashtags','Hashtags'],['tags','Tag'],['cta','Call to action']].filter(function(k){ return v[k[0]]; }).map(function(k){ return k[1] + ': ' + v[k[0]]; }).join('\n');
      case 'q15': return filesFor('q15').map(function(f){ return f.name; }).join('\n');
      case 'q16': return arr(v).map(function(x){ return label(L.platforms, x); }).join(', ');
      case 'q17': v = obj(v); return v.worldwide ? 'Worldwide, no preference' : (v.text || '');
      case 'q18': return arr(v).join('\n');
      default: return v == null ? '' : String(v);
    }
  }
  function qTitle(s){ return s.type === 'contact' ? (A.q3 === 'whatsapp' ? 'WhatsApp number' : A.q3 === 'instagram' ? 'Instagram handle' : 'Email address') : s.q; }
  function reviewHtml(editable){
    var vis = visible(), html = '';
    SECTIONS.forEach(function(name, si){
      var items = vis.filter(function(s){ return s.sec === si; });
      html += '<div class="rev-sec"><div class="rev-head"><h3>' + esc(name) + '</h3>'
        + (editable ? '<button class="rev-edit" type="button" data-go="' + items[0].id + '">Edit</button>' : '') + '</div>';
      items.forEach(function(s){
        var v = display(s.id);
        html += '<div class="rev-item"><div class="rl">' + esc(qTitle(s)) + '</div><div class="rv' + (v ? '' : ' empty') + '">' + (v ? esc(v) : 'Not answered') + '</div></div>';
      });
      html += '</div>';
    });
    return html;
  }
  function renderReview(){
    nav(true);
    prune();
    stage.innerHTML = '<div class="eyebrow">Review<span class="bar"></span></div><h1 class="q">Check your answers</h1>'
      + '<p class="help">Make sure everything looks right, then submit.</p><div style="margin-top:22px">' + reviewHtml(true) + '</div><div class="err" id="err" role="alert"></div>';
    Array.prototype.forEach.call(stage.querySelectorAll('[data-go]'), function(b){
      b.onclick = function(){ fromReview = true; go(b.getAttribute('data-go')); };
    });
  }

  // ---------- saving + navigation ----------
  function note(text, warn){
    var n = $('#savenote'); n.hidden = false; n.classList.toggle('warn', !!warn); $('#savetext').textContent = text;
  }
  function save(nextId){
    prune();
    return post('/save', { answers: A, last_question: nextId }).then(function(j){
      if (j._status === 409 && j.submitted) { load(); return; }
      if (!j.ok) throw new Error(j.error || 'save failed');
      saveFailed = false; note('Saved');
    }).catch(function(){ saveFailed = true; note('Not saved yet, will retry', true); });
  }
  function next(){
    if (cur === 'review') return submit();
    var s = BY_ID[cur];
    if (UP.some(function(u){ return !u.failed && (u.qid === 'q11b' || u.qid === 'q15') && document.querySelector('[data-files="' + u.qid + '"]'); })) {
      $('#err').textContent = 'Please wait for your uploads to finish'; return;
    }
    var e = s.check ? s.check() : '';
    if (e) { $('#err').textContent = e; return; }
    // Moving off "where footage comes from" without "upload" clears files uploaded there.
    if (cur === 'q11' && arr(A.q11).indexOf('upload') < 0) {
      filesFor('q11b').forEach(function(f){ api('/file?id=' + encodeURIComponent(f.id), { method:'DELETE' }); });
      FILES = FILES.filter(function(f){ return f.qid !== 'q11b'; });
    }
    prune();
    var vis = visible(), i = vis.findIndex(function(x){ return x.id === cur; });
    var to = i + 1 < vis.length ? vis[i + 1].id : 'review';
    save(to);
    go(to);
  }
  function back(){
    if (cur === 'review') { go(visible().slice(-1)[0].id); return; }
    var vis = visible(), i = vis.findIndex(function(x){ return x.id === cur; });
    go(i > 0 ? vis[i - 1].id : 'welcome');
  }
  function submit(){
    var btn = $('#nextBtn'); btn.disabled = true; btn.textContent = 'Submitting…';
    prune();
    post('/submit', { answers: A }).then(function(j){
      if (j._status === 422 && j.q) {
        fromReview = true;
        go(BY_ID[j.q] && (!BY_ID[j.q].show || BY_ID[j.q].show()) ? j.q : 'review');
        $('#err').textContent = j.error;
        return;
      }
      if (!j.ok) throw new Error(j.error || 'Something went wrong');
      apply(j);
    }).catch(function(err){
      $('#err').textContent = (err && err.message ? err.message : 'Something went wrong') + '. Please try again.';
    }).then(function(){ btn.disabled = false; btn.textContent = cur === 'review' ? 'Submit' : 'Continue'; });
  }

  $('#nextBtn').onclick = next;
  $('#backBtn').onclick = back;
  $('#reviewBtn').onclick = function(){
    var s = BY_ID[cur], e = s && s.check ? s.check() : '';
    if (e) { $('#err').textContent = e; return; }
    save('review'); go('review');
  };
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || $('#navbar').hidden) return;
    var t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON' || t.tagName === 'A')) return;
    e.preventDefault();
    if (cur !== 'review') next();
  });

  // ---------- after submit: booking + confirmation ----------
  function calLoaded(){
    (function (C, A, L) { var p = function (a, ar) { a.q.push(ar); }; var d = C.document; C.Cal = C.Cal || function () { var cal = C.Cal; var ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { var api = function () { p(api, arguments); }; var namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  }
  function renderBooking(){
    nav(false);
    $('#pfill').style.width = '100%'; $('#stepcount').textContent = '';
    restart();
    var b = S.booking || {};
    stage.innerHTML = '<div class="eyebrow">Last step<span class="bar"></span></div>'
      + '<h1 class="q">One last step: book your onboarding call</h1>'
      + '<p class="help">Pick a time that works for you. On the call, we’ll go through your answers and plan your launch.</p>'
      + (b.url ? '<div class="cal" id="cal"></div>' : '<div class="notice">Our booking calendar isn’t available right now. We’ll reach out to schedule your call.</div>')
      + '<div class="later"><button type="button" id="laterBtn">' + (b.url ? 'Book later' : 'Continue') + '</button></div>';
    $('#laterBtn').onclick = function(){
      S.booking_state = 'book_later';
      post('/state', { action:'book_later' });
      renderDone();
    };
    if (!b.url) return;
    try {
      var u = new URL(b.url);
      var calLink = u.pathname.replace(/^\/+|\/+$/g, '');
      var config = { layout:'month_view' };
      if (b.name) config.name = b.name;
      if (b.email) config.email = b.email;
      u.searchParams.forEach(function(v, k){ config[k] = v; });
      calLoaded();
      window.Cal('init', { origin: u.origin });
      window.Cal('inline', { elementOrSelector:'#cal', calLink: calLink, config: config });
      window.Cal('ui', { hideEventTypeDetails:false, layout:'month_view' });
      window.Cal('on', { action:'bookingSuccessful', callback: function(){
        S.booking_state = 'booked';
        post('/state', { action:'booked' });
        var l = $('#laterBtn'); if (l) { l.textContent = 'Continue'; l.onclick = renderDone; }
        setTimeout(function(){ if ($('#cal')) renderDone(); }, 6000);
      } });
    } catch (e) {
      $('#cal').outerHTML = '<div class="notice">Trouble loading the calendar? <a href="' + esc(b.url) + '" target="_blank" rel="noopener">Open it here</a>.</div>';
    }
  }
  function renderDone(){
    nav(false);
    $('#pfill').style.width = '100%'; $('#stepcount').textContent = '';
    restart();
    var b = S.booking || {};
    stage.innerHTML = '<div class="done"><div class="seal">✓</div><h1>You’re all set</h1>'
      + '<p>We have everything we need. Our team will review your answers before your onboarding call. You’ll receive your live campaign report link once the campaign is running.</p>'
      + (S.booking_state !== 'booked' && b.url ? '<div class="notice">You haven’t booked your onboarding call yet.<br><button class="btn btn-primary" id="bookBtn" type="button">Book your call</button></div>' : '')
      + '<details class="answers"><summary>Your answers</summary><div style="margin-top:14px">' + reviewHtml(false) + '</div></details></div>';
    var bb = $('#bookBtn'); if (bb) bb.onclick = renderBooking;
  }

  function apply(j){
    S = j;
    A = obj(j.answers);
    FILES = arr(j.files);
    if (j.campaign_name) $('#brandName').textContent = j.campaign_name;
    if (j.submitted) {
      if (j.booking_state) renderDone(); else renderBooking();
      return;
    }
    var vis = visible();
    var resume = j.last_question && (j.last_question === 'review' || vis.some(function(s){ return s.id === j.last_question; })) ? j.last_question : '';
    go(resume || 'welcome');
  }
  function load(){
    api('').then(function(j){
      if (j._status === 404) { nav(false); stage.innerHTML = '<div class="msg"><h1>Link not found</h1>This onboarding link isn’t valid. Please check the link you were sent, or reply to our message and we’ll send a new one.</div>'; return; }
      if (j._status === 429) { stage.innerHTML = '<div class="msg">' + esc(j.error) + '</div>'; return; }
      if (!j.ok) throw new Error(j.error || 'error');
      apply(j);
    }).catch(function(){
      stage.innerHTML = '<div class="msg"><h1>Can’t connect</h1>Please check your connection and reload the page.</div>';
    });
  }
  window.addEventListener('beforeunload', function(e){
    if (UP.some(function(u){ return !u.failed; })) { e.preventDefault(); e.returnValue = ''; }
  });
  load();
})();
</script>
</body>
</html>
