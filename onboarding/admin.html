<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Onboarding · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100E0A; --surface:#191510; --surface-2:#20190F;
    --cream:#F4EEE2; --text:#EFE7D5; --muted:#9E9278;
    --line:rgba(199,168,103,.16); --line-strong:rgba(199,168,103,.30);
    --gold:#C7A867; --gold-bright:#E1BF73; --danger:#E58C77; --ok:#8FCBA0; --blue:#9DB7E0;
    --serif:'EB Garamond', Garamond, serif; --sans:'Archivo', system-ui, sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  [hidden]{display:none!important}
  .wrap{max-width:980px; margin:0 auto; padding:32px 16px 80px}
  .eyebrow{font-weight:600; font-size:10.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold)}
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
  h1{font-family:var(--serif); font-weight:500; font-size:2rem; margin:8px 0 0; letter-spacing:-.01em}
  .hdr-btns{display:flex; gap:10px}
  .btn{font-family:var(--sans); font-weight:500; font-size:13.5px; border:1px solid var(--gold); background:var(--gold); color:#1b1407; border-radius:9px; padding:10px 18px; cursor:pointer; transition:.16s; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:6px}
  .btn:hover{background:var(--gold-bright); border-color:var(--gold-bright)}
  .btn.ghost{background:transparent; color:var(--gold)}
  .btn.ghost:hover{background:color-mix(in srgb,var(--gold) 10%, transparent)}
  .btn.sm{padding:6px 11px; font-size:12px; border-radius:7px}
  .btn.danger{border-color:color-mix(in srgb,var(--danger) 50%, transparent); color:var(--danger); background:transparent}
  .btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%, transparent)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  input[type=text], input[type=password], select{padding:11px 13px; border-radius:9px; border:1px solid var(--line-strong); background:#0e0b07; color:var(--cream); font-size:15px; font-family:var(--sans); width:100%}
  select{width:auto; font-size:13px; padding:8px 10px}
  input:focus, select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%, transparent)}
  label.mini{display:block; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}

  .gate{max-width:380px; margin:8vh auto 0; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:30px 26px}
  .gateMsg{color:var(--danger); font-size:12.5px; min-height:16px; margin-top:10px}

  .newbox{background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; padding:18px; margin-bottom:22px}
  .newrow{display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr auto auto; gap:10px; align-items:end}
  .newrow select{width:100%; font-size:15px; padding:11px 13px}
  @media (max-width:980px){ .newrow{grid-template-columns:1fr 1fr} }
  @media (max-width:700px){ .newrow{grid-template-columns:1fr} }
  .created{margin-top:14px; padding:12px 14px; border-radius:9px; background:color-mix(in srgb,var(--ok) 10%, transparent); border:1px solid color-mix(in srgb,var(--ok) 30%, transparent); font-size:13.5px; word-break:break-all}
  .created b{color:var(--ok); font-weight:600}
  .err{color:var(--danger); font-size:13px; margin-top:8px}
  .err:empty{display:none}

  .filters{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-weight:600; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); padding:10px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap}
  td{padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  tr:hover td{background:color-mix(in srgb,var(--surface) 70%, transparent)}
  td .nm{font-family:var(--serif); font-size:1.15rem; color:var(--text); line-height:1.2}
  td .sub{font-size:12px; color:var(--muted)}
  td.dt{font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
  td.acts{white-space:nowrap; text-align:right}
  td.acts .btn{margin-left:4px}
  .pill{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.06em; padding:3px 9px; border-radius:99px; border:1px solid; white-space:nowrap}
  .pill.sent{color:var(--muted); border-color:var(--line-strong)}
  .pill.opened{color:var(--blue); border-color:color-mix(in srgb,var(--blue) 45%, transparent)}
  .pill.in_progress{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 50%, transparent)}
  .pill.submitted{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 50%, transparent)}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-family:var(--serif); font-size:1.15rem}
  /* mobile: rows become cards */
  @media (max-width:760px){
    thead{display:none}
    table, tbody, tr, td{display:block; width:100%}
    tr{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; padding:6px 4px; background:var(--surface)}
    td{border:none; padding:6px 12px}
    td.acts{text-align:left}
    td.acts .btn{margin:4px 4px 0 0}
    td[data-l]::before{content:attr(data-l) ' '; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em; margin-right:6px}
  }

  .back{background:none; border:none; color:var(--gold); font-family:var(--sans); font-size:12.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:6px 0; margin-bottom:8px}
  .det-head{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; margin:8px 0 16px}
  .det-head .nm{font-family:var(--serif); font-size:1.7rem; color:var(--text); line-height:1.2}
  .det-head .nm span{color:var(--gold)}
  .det-head .call{margin-top:10px; font-weight:600; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-bright)}
  .det-head .meta{font-size:12.5px; color:var(--muted); margin-top:8px; display:flex; gap:16px; flex-wrap:wrap}
  .det-head a{color:var(--gold-bright)}
  .tools{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
  .sec{border-top:1px solid var(--line); padding:18px 0}
  .sec-h{font-weight:600; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); margin-bottom:10px}
  .qa{padding:7px 0}
  .qa .l{font-size:12px; color:var(--muted)}
  .qa .v{font-family:var(--serif); font-size:1.1rem; line-height:1.5; color:var(--text); white-space:pre-wrap; word-break:break-word; margin-top:2px}
  .qa .v a{color:var(--gold-bright)}
  .file{display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; margin-top:6px; background:var(--surface)}
  .file .fn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px}
  .file .fs{font-size:12px; color:var(--muted); white-space:nowrap}
  .status{font-size:12.5px; color:var(--muted); margin-top:14px}
  textarea{padding:11px 13px; border-radius:9px; border:1px solid var(--line-strong); background:#0e0b07; color:var(--cream); font-size:15px; font-family:var(--sans); width:100%; min-height:84px; resize:vertical}
  textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%, transparent)}
  .nx{font-size:12px; color:var(--muted); white-space:nowrap}
  .nx.due{color:var(--gold-bright); font-weight:600}
  .nx.done{color:var(--ok)}
  .nx.err{color:var(--danger); font-weight:600}
  .nx-r{display:block; font-size:11.5px; color:var(--danger); white-space:normal; max-width:260px; margin-top:2px}
  .stp.err .stp-st{color:var(--danger); font-weight:600; white-space:normal}
  .health{background:color-mix(in srgb,var(--danger) 9%, transparent); border:1px solid color-mix(in srgb,var(--danger) 35%, transparent); border-radius:12px; padding:14px 16px; margin-bottom:18px; font-size:13.5px}
  .health b{color:var(--danger); font-weight:600}
  .health ul{margin:8px 0 0; padding-left:18px}
  .health li{margin:3px 0}
  details.setup{margin-bottom:18px}
  details.setup summary{cursor:pointer; font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
  .setup .newbox{margin:12px 0 0}
  .warnline{margin-top:10px; font-size:13px; color:var(--danger)}
  /* client emails */
  .seq{background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; padding:18px 18px 8px; margin:0 0 18px}
  .seq-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px}
  .seq-top .note{font-size:12px; color:var(--muted)}
  .stp{border-top:1px solid var(--line)}
  .stp:first-of-type{border-top:0}
  .stp-h{display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; padding:12px 2px; cursor:pointer; background:none; border:0; width:100%; text-align:left; color:inherit; font:inherit}
  .stp-n{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12.5px; color:var(--muted)}
  .stp.done .stp-n{background:var(--ok); border-color:var(--ok); color:#0e1a12}
  .stp.ready .stp-n{border-color:var(--gold); color:var(--gold-bright)}
  .stp-t{font-family:var(--serif); font-size:1.12rem; line-height:1.2}
  .stp-s{font-size:11.5px; color:var(--muted); margin-top:2px}
  .stp-st{font-size:12px; color:var(--muted); text-align:right; white-space:nowrap}
  .stp.done .stp-st{color:var(--ok)}
  .stp.ready .stp-st{color:var(--gold-bright); font-weight:600}
  .stp-b{padding:4px 2px 18px 46px}
  @media (max-width:700px){ .stp-b{padding-left:2px} .stp-h{grid-template-columns:34px 1fr} .stp-st{grid-column:2; text-align:left} }
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .fgrid .wide{grid-column:1/-1}
  @media (max-width:700px){ .fgrid{grid-template-columns:1fr} }
  .hint{font-size:11.5px; color:var(--muted); margin-top:5px}
  .row-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center}
  .msg{font-size:13px; margin-top:10px}
  .msg.bad{color:var(--danger)} .msg.good{color:var(--ok)}
  .blk{font-size:13px; color:var(--muted); padding:8px 0}
  .wlog{font-size:12px; color:var(--muted); margin-top:10px}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:4vh 12px; overflow:auto}
  .modal-c{background:var(--surface); border:1px solid var(--line-strong); border-radius:14px; width:min(720px,100%); padding:18px}
  .modal-c .meta{font-size:12.5px; color:var(--muted); margin:6px 0 12px; word-break:break-word}
  .modal-c iframe{width:100%; height:62vh; border:1px solid var(--line); border-radius:10px; background:#f4eee2}
  .short{margin-top:14px; background:#0e0b07; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.55; white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <div class="eyebrow">Maison d'Élites</div>
    <h1 style="font-size:1.5rem;margin-bottom:18px">Onboarding</h1>
    <label class="mini" for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••">
    <div class="gateMsg" id="gateMsg"></div>
    <button class="btn" id="unlock" style="margin-top:14px;width:100%;justify-content:center">Unlock</button>
  </div>

  <div id="app" hidden>
    <header>
      <div><div class="eyebrow">Maison d'Élites</div><h1>Onboarding</h1></div>
      <div class="hdr-btns">
        <button class="btn" id="newBtn" type="button">+ New onboarding link</button>
        <button class="btn ghost" id="lock" type="button">Lock</button>
      </div>
    </header>
    <div id="health"></div>
    <div id="view"></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var $ = function(s, r){ return (r || document).querySelector(s); };
  function pw(){ try { return sessionStorage.getItem('mde_pw') || ''; } catch (e) { return ''; } }
  function setPw(v){ try { sessionStorage.setItem('mde_pw', v); } catch (e) {} }
  function clearPw(){ try { sessionStorage.removeItem('mde_pw'); } catch (e) {} }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmt(s){ if (!s) return '—'; try { return new Date(s).toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch (e) { return s; } }
  function size(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function slugify(v){ return String(v || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
  var STATUS = { sent:'Sent', opened:'Opened', in_progress:'In progress', submitted:'Submitted' };
  var CALL = { personal_branding:'Personal branding call', standard:'Standard onboarding call' };
  var BASE = 'https://onboarding.maisondelites.com';
  var LINKS = [];
  var filters = { status:'', call:'' };
  var openNew = false;

  function req(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization':'Bearer ' + pw() }, opts.headers || {});
    return fetch('/onboarding/api/admin/' + path, opts).then(function(r){
      if (r.status === 401) { clearPw(); showGate('Wrong password.'); throw new Error('unauthorized'); }
      return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
    });
  }
  function showGate(msg){ $('#app').hidden = true; $('#gate').hidden = false; $('#gateMsg').textContent = msg || ''; $('#pw').focus(); }
  function showApp(){ $('#gate').hidden = true; $('#app').hidden = false; }
  function linkUrl(token){ return BASE + '/' + token; }
  function copy(text, btn){
    var done = function(){ var t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(function(){ btn.textContent = t; }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function(){ prompt('Copy this link:', text); });
    else prompt('Copy this link:', text);
  }

  // ---------- list ----------
  function loadList(){
    if (!pw()) { showGate(); return; }
    return req('links').then(function(j){
      showApp();
      BASE = j.base || BASE;
      LINKS = j.links || [];
      loadHealth();
      if (location.hash.length > 1) { loadOne(location.hash.slice(1)); return; }
      renderList();
    }).catch(function(e){ if (e.message !== 'unauthorized') showGate(e.message); });
  }
  function renderList(newUrl, welcome){
    var view = $('#view');
    var rows = LINKS.filter(function(l){
      return (!filters.status || l.status === filters.status) && (!filters.call || l.call_type === filters.call);
    });
    var html = '<div class="newbox" id="newBox" hidden>'
      + '<div class="newrow">'
      + '<div><label class="mini" for="nClient">Client name</label><input id="nClient" type="text" placeholder="e.g. Acme Records"></div>'
      + '<div><label class="mini" for="nCampaign">Campaign name</label><input id="nCampaign" type="text" placeholder="e.g. Summer single launch"></div>'
      + '<div><label class="mini" for="nFirst">Client first name</label><input id="nFirst" type="text" placeholder="For the welcome email"></div>'
      + '<div><label class="mini" for="nEmail">Client email</label><input id="nEmail" type="text" placeholder="name@example.com"></div>'
      + '<div><label class="mini" for="nCall">Call type</label><select id="nCall"><option value="standard">Standard onboarding call</option><option value="personal_branding">Personal branding call</option></select></div>'
      + '<button class="btn" id="createBtn" type="button">Create link</button>'
      + '<button class="btn ghost" id="cancelBtn" type="button">Cancel</button>'
      + '</div><div class="err" id="newErr"></div></div>'
      + (newUrl ? '<div class="created" id="created"><b>Link created.</b> ' + welcomeNote(welcome) + ' Link: <span id="newUrl">' + esc(newUrl) + '</span> <button class="btn sm ghost" id="copyNew" type="button">Copy link</button>'
        + (welcome && welcome.error ? '<div class="warnline">Welcome email failed: ' + esc(welcome.error) + '</div>' : '') + '</div><div style="height:18px"></div>' : '')
      + '<div class="filters">Filter'
      + '<select id="fStatus"><option value="">All statuses</option>' + Object.keys(STATUS).map(function(k){ return '<option value="' + k + '"' + (filters.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>'; }).join('') + '</select>'
      + '<select id="fCall"><option value="">All call types</option>' + Object.keys(CALL).map(function(k){ return '<option value="' + k + '"' + (filters.call === k ? ' selected' : '') + '>' + CALL[k] + '</option>'; }).join('') + '</select>'
      + '<span style="margin-left:auto">' + rows.length + ' of ' + LINKS.length + '</span></div>';
    if (!LINKS.length) html += '<div class="empty">No onboarding links yet.<br>Click <b>New onboarding link</b> to create the first one.</div>';
    else if (!rows.length) html += '<div class="empty">Nothing matches these filters.</div>';
    else {
      html += '<table><thead><tr><th>Client · campaign</th><th>Status</th><th>Emails</th><th>Call type</th><th>Created</th><th>Submitted</th><th></th></tr></thead><tbody>'
        + rows.map(function(l){
          return '<tr><td><div class="nm">' + esc(l.client_name) + '</div><div class="sub">' + esc(l.campaign_name) + '</div></td>'
            + '<td data-l="Status"><span class="pill ' + esc(l.status) + '">' + esc(STATUS[l.status] || l.status) + '</span></td>'
            + '<td data-l="Emails"><span class="nx' + (l.next && l.next.error ? ' err' : l.next && l.next.done ? ' done' : l.next && l.next.due ? ' due' : '') + '">' + esc((l.next && l.next.label) || '') + '</span>'
            + (l.next && l.next.reason ? '<span class="nx-r">' + esc(l.next.reason) + '</span>' : '') + '</td>'
            + '<td data-l="Call" class="dt">' + esc(CALL[l.call_type] || '—') + '</td>'
            + '<td data-l="Created" class="dt">' + esc(fmt(l.created_at)) + '</td>'
            + '<td data-l="Submitted" class="dt">' + esc(fmt(l.submitted_at)) + '</td>'
            + '<td class="acts">'
            + '<button class="btn sm ghost" data-copy="' + esc(l.token) + '" type="button">Copy link</button>'
            + '<button class="btn sm ghost" data-view="' + esc(l.token) + '" type="button">View answers</button>'
            + (l.status === 'submitted' ? '<button class="btn sm ghost" data-reopen="' + esc(l.token) + '" type="button">Reopen</button>' : '')
            + '<button class="btn sm danger" data-del="' + esc(l.token) + '" type="button">Delete</button>'
            + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    view.innerHTML = html;
    wireList();
    if (openNew) { openNew = false; openNewBox(); }
    if (newUrl) $('#copyNew').onclick = function(){ copy(newUrl, this); };
  }
  function wireList(){
    $('#fStatus').onchange = function(){ filters.status = this.value; renderList(); };
    $('#fCall').onchange = function(){ filters.call = this.value; renderList(); };
    $('#cancelBtn').onclick = function(){ $('#newBox').hidden = true; };
    $('#createBtn').onclick = create;
    ['#nClient', '#nCampaign', '#nFirst', '#nEmail'].forEach(function(s){ $(s).addEventListener('keydown', function(e){ if (e.key === 'Enter') create(); }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function(b){ b.onclick = function(){ copy(linkUrl(b.getAttribute('data-copy')), b); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function(b){ b.onclick = function(){ location.hash = b.getAttribute('data-view'); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-reopen]'), function(b){ b.onclick = function(){ reopen(b.getAttribute('data-reopen')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){ b.onclick = function(){ del(b.getAttribute('data-del')); }; });
  }
  function welcomeNote(w){
    if (!w) return 'Send this to the client.';
    if (w.sent) return 'Welcome email with the form link sent to ' + esc((w.to || []).join(', ')) + '.';
    if (w.skipped) return 'No welcome email sent (no first name or email). Send the link yourself, or add them on the client’s page.';
    return 'Send this to the client.';
  }
  function openNewBox(){
    var c = $('#created'); if (c) c.remove();
    $('#newBox').hidden = false; $('#nClient').focus();
  }
  function create(){
    var c = $('#nClient').value.trim(), k = $('#nCampaign').value.trim();
    if (!c || !k) { $('#newErr').textContent = 'Enter both the client name and the campaign name.'; return; }
    $('#createBtn').disabled = true;

  // ---------- client emails (the seven-email onboarding sequence) ----------
  var SEQ = null, SEQ_OPEN = '', SEQ_LINK = null, SEQ_ANS = {};

  };
  function seqReq(token, body){
    return req('sequence?token=' + encodeURIComponent(token), body ? { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body) } : undefined);
  }
  function loadSeq(l, a){
    SEQ_LINK = l; SEQ_ANS = a || {};

      .catch(function(e){ var el = $('#seq'); if (el && e.message !== 'unauthorized') el.innerHTML = '<div class="status">' + esc(e.message) + '</div>'; });
  }
  function firstOpen(){
    var s = (SEQ.steps || []).find(function(x){ return !x.sent_at && !x.blocked && x.id !== 'reminder'; });
    return s ? s.id : '';
  }
  function stepState(st){
    if (st.id === 'weekly') {
      var n = (SEQ.weekly || []).length;
      if (SEQ.sent.complete) return ['done', n ? n + ' sent' : 'Not used'];
      if (st.blocked) return ['', 'After the live email'];
      var due = SEQ.weekly_due && new Date(SEQ.weekly_due) <= new Date();
      return [due ? 'ready' : (n ? 'done' : ''), (n ? n + ' sent · ' : '') + (due ? 'Week ' + (n + 1) + ' due now' : 'Next due ' + fmt(SEQ.weekly_due))];
    }
    if (st.sent_at) return ['done', 'Sent ' + fmt(st.sent_at)];
    var er = (SEQ.errors || {})[st.id];

    if (st.id === 'reminder') {
      if (st.blocked) return ['', st.blocked === 'The client has submitted the form.' ? 'Not needed, form submitted' : 'After the welcome'];
      return ['', 'Sends by itself ' + fmt(SEQ.auto_reminder_at)];

  }
  function fieldHtml(def){

      return '<div class="' + cls + '"><label class="mini">Invoice PDF</label><input type="file" accept="application/pdf,.pdf" data-pdf>'
        + '<div class="hint">' + (cur ? 'Attached: ' + esc(cur.name) + ' (' + size(cur.size) + '). Choose a file to replace it.' : 'Attached to the email. Required.') + '</div></div>';
    }

  function renderSeq(){
    var el = $('#seq'); if (!el || !SEQ) return;

    html += (SEQ.steps || []).map(function(st){

        if (st.id === 'weekly' && SEQ.sent.complete) canSend = false;
        b += '<div class="row-btns">'
          + '<button class="btn ghost" data-prev="' + st.id + '" type="button">Preview</button>'
          + (canSend ? '<button class="btn" data-send="' + st.id + '" type="button">Send email' + (st.id === 'weekly' ? ' (week ' + ((SEQ.weekly || []).length + 1) + ')' : '') + '</button>' : '')

        + '<span><div class="stp-t">' + esc(st.name) + '</div><div class="stp-s">' + esc(st.trigger) + ' · ' + esc(st.timing) + '</div></span>'
        + '<span class="stp-st">' + esc(ss[1]) + '</span></button>' + b + '</div>';

    Array.prototype.forEach.call(el.querySelectorAll('[data-send]'), function(btn){ btn.onclick = function(){ seqAction(btn.getAttribute('data-send'), 'preview', btn, true); }; });
    Array.prototype.forEach.call(el.querySelectorAll('[data-mark]'), function(btn){ btn.onclick = function(){

      set(w ? 'best_url' : 'top_url', n.best_url || ''); set(w ? 'best_views' : 'top_views', String(n.best_views || ''));

  function collect(){

  function readPdf(){

      var r = new FileReader();
      r.onload = function(){ res({ name: file.name, data: String(r.result).split(',')[1] || '' }); };

    m.addEventListener('click', function(e){ if (e.target === m) close(); });
    m.querySelector('#pvClose').onclick = close;
    m.querySelector('#pvCopy').onclick = function(){ copy(p.short, this); };
    var sb = m.querySelector('#pvSend');
    if (sb) sb.onclick = function(){
      sb.disabled = true; sb.textContent = 'Sending…';
      seqReq(SEQ_LINK.token, { step: p.step, action: 'send' }).then(function(j){
        SEQ = j.sequence || SEQ;
        var nx = firstOpen(); SEQ_OPEN = nx || '';
        m.remove(); renderSeq();
        var mm = $('#msg-' + (nx || p.step)); if (mm) { mm.className = 'msg good'; mm.textContent = 'Sent: ' + p.subject; }
      }).catch(function(e){ sb.disabled = false; sb.textContent = 'Try again'; var pm = m.querySelector('#pvMsg'); pm.className = 'msg bad'; pm.textContent = e.message; });
    };
  }

  // Campaign dashboards live on campaigns.maisondelites.com/<slug>; the editor
  // there reads ?onboarding=<token> and prefills itself from this submission.
  function campaignsBase(){ return location.hostname.indexOf('campaigns.') === 0 ? '' : 'https://campaigns.maisondelites.com'; }
  function makeCampaign(l, a){
    var slug = slugify(prompt('Dashboard address for this campaign (campaigns.maisondelites.com/…):', l.campaign_id || slugify(a.q1 || l.client_name)) || '');
    if (!slug) return;
    window.open(campaignsBase() + '/' + slug + '/admin?onboarding=' + encodeURIComponent(l.token), '_blank', 'noopener');
  }

  window.addEventListener('hashchange', function(){ if (location.hash.length > 1) loadOne(location.hash.slice(1)); else loadList(); });
  $('#newBtn').onclick = function(){
    if (location.hash.length > 1) { openNew = true; location.hash = ''; return; }
    openNewBox();
  };
  $('#unlock').onclick = function(){ var v = $('#pw').value.trim(); if (!v) { $('#gateMsg').textContent = 'Enter the password.'; return; } setPw(v); loadList(); };
  $('#pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#unlock').click(); });
  $('#lock').onclick = function(){ clearPw(); showGate(); };
  loadList();
})();
</script>
</body>
</html>
