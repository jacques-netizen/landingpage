# Cloudflare Worker config (static site + upload API).
#
# Deployed as a Worker with static assets. The Worker runs first on every
# request (run_worker_first) so host-based routing works; /api/* and /v/* are
# handled in code, and every other path is served from the repo static files.
#
# Bindings:
#   - ASSETS : the static site files (configured below)
#   - MEDIA  : R2 bucket for uploaded videos (also added in the dashboard)
# Secret (set in the dashboard, NOT here):
#   - ADMIN_PASSWORD : password for the /admin upload page
#
# Local testing:
#   npm i -g wrangler
#   echo 'ADMIN_PASSWORD = "test123"' > .dev.vars
#   wrangler dev --r2 MEDIA
#   open http://localhost:8787/admin

name = "landingpage"
main = "worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "."
binding = "ASSETS"
# Run the Worker before static assets so host-based routing (book.* root ->
# calendar) applies even on paths that match a static file (like "/").
run_worker_first = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "maison-delites-media"

# Campaign dashboard auto-sync. Every 15 minutes the Worker pulls the CSV at
# CAMPAIGN_CSV_URL (e.g. a published Google Sheet) and refreshes /dashboard.
# Harmless no-op until you set that variable, so it is safe to leave enabled.
[triggers]
crons = ["*/15 * * * *"]
