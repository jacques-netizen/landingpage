<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Discovery · Maison d'Élites</title>
<meta name="description" content="A guided brand-discovery questionnaire — tell us who you are, who you serve, and what makes you different.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110D; --ink-soft:#2A251D;
    --bg:#F4EEE2; --surface:#FBF7EE; --surface-2:#EFE7D7;
    --text:#221D15; --muted:#7A7163;
    --line:rgba(20,17,13,.13); --line-strong:rgba(20,17,13,.24);
    --gold:#9A7B36; --gold-bright:#B9923F;
    --field-bg:#FFFFFF; --field-line:rgba(20,17,13,.18);
    --hero-bg:#14110D; --hero-text:#F4EEE2; --hero-gold:#C7A867;
    --danger:#9A3B2A; --ok:#3F7A4F;
    --shadow:0 22px 55px rgba(20,17,13,.12);
    --serif:'EB Garamond', Garamond, 'Times New Roman', serif;
    --sans:'Archivo', system-ui, -apple-system, sans-serif;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ink:#0C0A07; --ink-soft:#1A160F;
      --bg:#100E0A; --surface:#191510; --surface-2:#20190F;
      --text:#EFE7D5; --muted:#9E9278;
      --line:rgba(199,168,103,.15); --line-strong:rgba(199,168,103,.30);
      --gold:#C7A867; --gold-bright:#E1BF73;
      --field-bg:#141009; --field-line:rgba(199,168,103,.24);
      --hero-bg:#0A0906; --hero-text:#F4EEE2; --hero-gold:#C7A867;
      --danger:#E58C77; --ok:#8FCBA0;
      --shadow:0 22px 55px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#0C0A07; --ink-soft:#1A160F;
    --bg:#100E0A; --surface:#191510; --surface-2:#20190F;
    --text:#EFE7D5; --muted:#9E9278;
    --line:rgba(199,168,103,.15); --line-strong:rgba(199,168,103,.30);
    --gold:#C7A867; --gold-bright:#E1BF73;
    --field-bg:#141009; --field-line:rgba(199,168,103,.24);
    --hero-bg:#0A0906; --hero-text:#F4EEE2; --hero-gold:#C7A867;
    --danger:#E58C77; --ok:#8FCBA0;
    --shadow:0 22px 55px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); font-weight:300; line-height:1.65;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px));
    min-height:100vh;
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  /* ---- top progress ---- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .progress-track{height:3px; width:100%; background:transparent}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .5s cubic-bezier(.4,0,.1,1)}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; max-width:900px; margin:0 auto}
  .wordmark{font-family:var(--serif); font-size:1.05rem; letter-spacing:.01em; color:var(--text); display:flex; align-items:center; gap:9px}
  .wordmark b{font-weight:500}
  .wordmark .mark{font-family:var(--sans); font-weight:600; font-size:9.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold)}
  .wordmark .txt{display:flex; align-items:baseline; gap:8px}

  /* engraved monogram crest */
  .crest{color:var(--gold); flex:none}
  .crest.sm{width:26px; height:26px}
  .crest.lg{width:64px; height:64px; margin:0 auto 4px; display:block}
  .hero .crest.lg{color:var(--hero-gold)}
  .stepcount{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums}

  /* ---- layout ---- */
  .wrap{max-width:680px; margin:0 auto; padding:0 20px}
  .stage{padding-block:40px 150px; animation:rise .5s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .stage{animation:none} .progress-fill{transition:none} }

  .eyebrow{font-family:var(--sans); font-weight:600; font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:10px}
  .eyebrow .no{font-variant-numeric:tabular-nums}
  .eyebrow .bar{flex:1; height:1px; background:var(--line-strong); max-width:60px}

  h1.chapter{font-family:var(--serif); font-weight:500; font-size:clamp(2.1rem,6.4vw,3.1rem); line-height:1.05; letter-spacing:-.01em; margin:18px 0 0; color:var(--text); text-wrap:balance}
  .lede{font-family:var(--serif); font-size:clamp(1.08rem,2.5vw,1.24rem); line-height:1.5; color:var(--muted); margin:14px 0 0; max-width:46ch}
  .lede em{color:var(--gold-bright); font-style:italic}

  .fields{margin-top:34px; display:flex; flex-direction:column; gap:26px}
  .group{margin-top:38px}
  .group-h{font-family:var(--sans); font-weight:600; font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:26px; display:flex; align-items:center; gap:10px}

  .field label.q{display:block; font-family:var(--serif); font-size:1.22rem; line-height:1.35; color:var(--text); font-weight:500; margin-bottom:4px}
  .field .help{font-family:var(--sans); font-size:12.5px; color:var(--muted); margin:0 0 12px; line-height:1.5}
  .req{color:var(--gold); font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; vertical-align:middle; margin-left:8px}

  input[type=text], input[type=email], textarea{
    width:100%; font-family:var(--sans); font-weight:300; font-size:15.5px; line-height:1.6;
    color:var(--text); background:var(--field-bg);
    border:1px solid var(--field-line); border-radius:8px; padding:13px 15px;
    transition:border-color .18s, box-shadow .18s, background .18s; resize:vertical;
  }
  textarea{min-height:96px}
  textarea.long{min-height:150px}
  input::placeholder, textarea::placeholder{color:color-mix(in srgb, var(--muted) 72%, transparent)}
  input:focus, textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent)}
  .field.invalid input, .field.invalid textarea{border-color:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent)}
  .err{color:var(--danger); font-family:var(--sans); font-size:12px; margin-top:7px; display:none}
  .field.invalid .err{display:block}

  /* repeatable list */
  .listrow{display:flex; gap:9px; align-items:center; margin-bottom:9px}
  .listrow .dot{font-family:var(--serif); color:var(--gold); width:16px; text-align:center; flex:none; font-size:1.1rem}
  .listrow input{flex:1}
  .iconbtn{flex:none; width:34px; height:34px; border-radius:7px; border:1px solid var(--line-strong); background:transparent; color:var(--muted); font-size:17px; line-height:1; cursor:pointer; transition:.16s}
  .iconbtn:hover{color:var(--danger); border-color:var(--danger)}
  .addbtn{margin-top:6px; background:transparent; border:1px dashed var(--line-strong); color:var(--gold); font-family:var(--sans); font-weight:500; font-size:12.5px; letter-spacing:.04em; padding:10px 16px; border-radius:8px; cursor:pointer; transition:.16s}
  .addbtn:hover{border-color:var(--gold); background:color-mix(in srgb,var(--gold) 8%, transparent)}
  .addbtn:disabled{opacity:.4; cursor:not-allowed}

  /* competitor card */
  .compcard{border:1px solid var(--line); border-radius:12px; padding:18px 18px 20px; background:var(--surface); margin-bottom:16px; box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .compcard .ch{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .compcard .cn{font-family:var(--sans); font-weight:600; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold)}
  .compcard input{margin-bottom:12px}
  .compcard label.mini{display:block; font-family:var(--sans); font-size:11.5px; color:var(--muted); margin-bottom:6px; letter-spacing:.02em}

  /* welcome hero */
  .hero{background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--hero-gold) 14%, transparent), transparent 60%), var(--hero-bg); color:var(--hero-text); border-radius:16px; padding:46px 30px 40px; text-align:center; box-shadow:var(--shadow); border:1px solid color-mix(in srgb,var(--hero-gold) 20%, transparent)}
  .hero .eyebrow{justify-content:center; color:var(--hero-gold)}
  .hero .eyebrow .bar{background:color-mix(in srgb,var(--hero-gold) 40%, transparent)}
  .hero h1{font-family:var(--serif); font-weight:500; font-size:clamp(2.3rem,7vw,3.4rem); line-height:1.03; letter-spacing:-.01em; margin:20px 0 0; color:var(--hero-text)}
  .hero h1 em{font-style:italic; color:var(--hero-gold)}
  .hero p{font-family:var(--serif); font-size:clamp(1.1rem,2.7vw,1.3rem); line-height:1.55; color:color-mix(in srgb,var(--hero-text) 82%, transparent); max-width:40ch; margin:18px auto 0}
  .hero .meta{display:flex; gap:26px; justify-content:center; flex-wrap:wrap; margin-top:28px}
  .hero .meta .m{font-family:var(--sans)}
  .hero .meta .mv{font-family:var(--serif); font-size:1.5rem; color:var(--hero-gold); line-height:1}
  .hero .meta .ml{font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:color-mix(in srgb,var(--hero-text) 60%, transparent); margin-top:7px}

  /* optional intro video (shows only if one is uploaded to /v/brand-intro) */
  .intro-video{margin-top:26px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000; box-shadow:var(--shadow); aspect-ratio:16/9}
  .intro-video video{display:block; width:100%; height:100%; object-fit:cover}

  .about{margin-top:30px; font-family:var(--serif); font-size:1.06rem; line-height:1.6; color:var(--muted)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px 22px; margin-top:26px; box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .card .card-h{font-family:var(--sans); font-weight:600; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); margin-bottom:20px}

  /* footer nav */
  .navbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:color-mix(in srgb,var(--bg) 90%, transparent); backdrop-filter:saturate(140%) blur(12px); border-top:1px solid var(--line); padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
  .navbar-inner{max-width:680px; margin:0 auto; display:flex; align-items:center; gap:14px}
  .savenote{font-family:var(--sans); font-size:11px; color:var(--muted); display:flex; align-items:center; gap:7px; margin-right:auto; letter-spacing:.02em}
  .savenote .tick{width:6px; height:6px; border-radius:50%; background:var(--ok)}
  .btn{font-family:var(--sans); font-weight:500; font-size:14px; letter-spacing:.02em; border-radius:10px; padding:13px 26px; cursor:pointer; border:1px solid transparent; transition:.18s; display:inline-flex; align-items:center; gap:9px; white-space:nowrap}
  .btn-primary{background:var(--gold); color:#fff; border-color:var(--gold)}
  :root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary{color:#1b1407}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-primary{color:#1b1407} }
  .btn-primary:hover{background:var(--gold-bright); border-color:var(--gold-bright); transform:translateY(-1px)}
  .btn-ghost{background:transparent; color:var(--muted); border-color:var(--line-strong)}
  .btn-ghost:hover{color:var(--text); border-color:var(--text)}
  .btn:disabled{opacity:.55; cursor:not-allowed; transform:none}
  .btn.wide{padding-left:34px; padding-right:34px}

  /* review */
  .rev-sec{border-top:1px solid var(--line); padding:22px 0}
  .rev-sec:first-of-type{border-top:none}
  .rev-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px}
  .rev-head h3{font-family:var(--serif); font-weight:500; font-size:1.4rem; margin:0; color:var(--text)}
  .rev-edit{font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); background:none; border:none; cursor:pointer; padding:4px}
  .rev-edit:hover{color:var(--gold-bright); text-decoration:underline}
  .rev-item{padding:9px 0; display:grid; grid-template-columns:1fr; gap:2px}
  .rev-item .rl{font-family:var(--sans); font-size:12px; color:var(--muted); letter-spacing:.02em}
  .rev-item .rv{font-family:var(--serif); font-size:1.08rem; line-height:1.5; color:var(--text); white-space:pre-wrap; word-break:break-word}
  .rev-item .rv.empty{color:color-mix(in srgb,var(--muted) 70%, transparent); font-style:italic}

  /* success */
  .done{text-align:center; padding:30px 10px}
  .done .seal{width:78px; height:78px; margin:0 auto 26px; border-radius:50%; background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--hero-gold) 30%, var(--hero-bg)), var(--hero-bg)); border:1px solid color-mix(in srgb,var(--gold) 45%, transparent); display:flex; align-items:center; justify-content:center; color:var(--gold-bright); font-size:34px; box-shadow:var(--shadow)}
  .done h1{font-family:var(--serif); font-weight:500; font-size:clamp(2rem,6vw,2.8rem); margin:0; color:var(--text)}
  .done p{font-family:var(--serif); font-size:1.14rem; color:var(--muted); max-width:40ch; margin:16px auto 0; line-height:1.55}
  .done .cta-row{margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:14px}
  .done .redir{font-family:var(--sans); font-size:12px; color:var(--muted); letter-spacing:.02em}
  .done .redir a{color:var(--gold); text-decoration:underline; cursor:pointer}

  /* fallback / status */
  .status{font-family:var(--sans); font-size:13px; margin-top:16px; padding:12px 16px; border-radius:10px; line-height:1.55; display:none}
  .status.show{display:block}
  .status.err{background:color-mix(in srgb,var(--danger) 12%, transparent); color:var(--danger); border:1px solid color-mix(in srgb,var(--danger) 30%, transparent)}
  .fallback{margin-top:22px; text-align:left}
  .fallback textarea{min-height:200px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px}
  .spin{width:15px;height:15px;border:2px solid color-mix(in srgb,#fff 45%, transparent);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
  :root[data-theme="dark"] .spin,:root:not([data-theme="light"]) .spin{border-color:color-mix(in srgb,#1b1407 45%,transparent);border-top-color:#1b1407}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    <div class="topbar-row">
      <span class="wordmark">
        <svg class="crest sm" viewBox="0 0 64 64" aria-hidden="true" fill="none"><circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.2"/><circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="0.6" opacity="0.5"/><text x="32" y="41.5" text-anchor="middle" font-family="EB Garamond, serif" font-size="27" font-style="italic" fill="currentColor">M</text><text x="43.5" y="27" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" font-style="italic" fill="currentColor">é</text></svg>
        <span class="txt"><span class="mark">Maison d'Élites</span> <b>Brand Discovery</b></span>
      </span>
      <span class="stepcount" id="stepcount"></span>
    </div>
  </div>

  <div class="wrap">
    <div class="stage" id="stage"></div>
  </div>

  <div class="navbar" id="navbar">
    <div class="navbar-inner">
      <span class="savenote" id="savenote" hidden><span class="tick"></span> Saved on this device</span>
      <button class="btn btn-ghost" id="backBtn" type="button">Back</button>
      <button class="btn btn-primary wide" id="nextBtn" type="button">Continue</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---- where completed sheets are sent (same-origin Cloudflare endpoint) ----
  var ENDPOINT = "/api/brandsheet";
  var STORAGE_KEY = "mde_brandsheet_v1";
  var BOOK_URL = "https://book.maisondelites.com"; // thank-you funnel
  var REDIRECT_SECONDS = 12; // gentle auto-redirect after submit (0 = off)

  // ---------- questionnaire definition ----------
  var CHAPTERS = [
    {
      id:"personal", no:"01", kicker:"Who you are", title:"Personal Brand",
      lede:"Start with the human behind the brand — in your own words.",
      fields:[
        {k:"my_brand", q:"Your brand, in one line", type:"text", ph:"e.g. I help ambitious founders build a magnetic personal brand"},
        {k:"known_for", q:"The things people know you for", type:"list", help:"Add at least 4.", start:4, min:1, max:7, ph:"Something you’re recognised for…"},
        {k:"why", q:"Why are you doing this?", type:"textarea"},
        {k:"journey", q:"Your brand journey", type:"long", help:"One full paragraph: what you want to do, your goals, and where you are right now."}
      ]
    },
    {
      id:"dream", no:"02", kicker:"Who you’re for", title:"Dream Follower & ICP",
      lede:"Your <em>dream follower</em> is broader than your ICP — but shares the same values and belief system.",
      groups:[
        {h:"Dream Follower", fields:[
          {k:"df_story", q:"Who are they? What’s their story?", type:"textarea"},
          {k:"df_passion", q:"What are they passionate about?", type:"textarea"},
          {k:"df_goals", q:"Their goals, dreams and desires?", type:"textarea"},
          {k:"df_fears", q:"Their deepest fears?", type:"textarea"},
          {k:"df_struggles", q:"Their biggest struggles right now?", type:"textarea"}
        ]},
        {h:"ICP — Ideal Customer Profile", fields:[
          {k:"icp_income", q:"How much are they currently making?", type:"text"},
          {k:"icp_business", q:"What business are they in?", type:"text"},
          {k:"icp_current", q:"Current situation", type:"textarea"},
          {k:"icp_desired", q:"Desired outcome", type:"textarea"},
          {k:"icp_problems", q:"Perceived problems", type:"textarea"},
          {k:"icp_badfit", q:"What makes someone a bad fit?", type:"textarea"},
          {k:"icp_beliefs", q:"Limiting beliefs they hold", type:"textarea"}
        ]}
      ]
    },
    {
      id:"identity", no:"03", kicker:"What you stand for", title:"Brand Identity",
      lede:"The story, values and personality people will fall for.",
      groups:[
        {fields:[
          {k:"bi_origin", q:"Origin story — why will people love you for you?", type:"long"},
          {k:"bi_values", q:"What are your values?", type:"textarea"},
          {k:"bi_beliefs", q:"What are your beliefs?", type:"textarea"},
          {k:"bi_personality", q:"Your personality?", type:"textarea"},
          {k:"bi_visual", q:"Visual style", type:"textarea", help:"Colours, aesthetic, references, the feeling it should give."}
        ]},
        {h:"Business Vehicle", fields:[
          {k:"bv_what", q:"What do you do?", type:"textarea"},
          {k:"bv_why", q:"Why?", type:"textarea"},
          {k:"bv_value", q:"What kind of value do you bring?", type:"textarea"}
        ]}
      ]
    },
    {
      id:"business", no:"04", kicker:"How it works", title:"Business Identity",
      lede:"The engine underneath the brand.",
      fields:[
        {k:"biz_serve", q:"Who do you serve?", type:"textarea"},
        {k:"biz_offer", q:"What’s your offer?", type:"textarea"},
        {k:"biz_mrr", q:"Monthly recurring revenue (MRR)", type:"text", ph:"e.g. £12k / month"},
        {k:"biz_margin", q:"Profit margin", type:"text", ph:"e.g. ~70%"},
        {k:"biz_proof", q:"Case studies & testimonials", type:"long", help:"Names, numbers, results — whatever you can point to."},
        {k:"biz_promise", q:"What do you promise your customers?", type:"textarea"}
      ]
    },
    {
      id:"industry", no:"05", kicker:"The landscape", title:"Industry Identity",
      lede:"Where you play, and how you see the game.",
      fields:[
        {k:"ind_industry", q:"What industry do you operate in?", type:"text"},
        {k:"ind_state", q:"The current state of your industry", type:"textarea"},
        {k:"ind_trends", q:"Major trends you’re seeing", type:"textarea"},
        {k:"ind_competitive", q:"How competitive is it?", type:"textarea"},
        {k:"ind_separates", q:"What separates you?", type:"long"}
      ]
    },
    {
      id:"competitors", no:"06", kicker:"The field", title:"Competitor Research",
      lede:"Find <em>5 competitors</em> and note what you genuinely admire about each.",
      type:"competitors"
    }
  ];

  // ---------- state ----------
  var state = { fields:{}, lists:{}, competitors:[] };
  var stepIndex = 0; // 0 = welcome, 1..CHAPTERS.length = chapters, +1 = review
  var TOTAL = CHAPTERS.length + 2; // welcome + chapters + review

  function loadSaved(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ var s = JSON.parse(raw); if(s && typeof s==="object"){
        state.fields = s.fields||{}; state.lists = s.lists||{}; state.competitors = s.competitors||[];
        return true;
      }}
    }catch(e){}
    return false;
  }
  var savedTimer=null;
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    var n=document.getElementById("savenote"); if(n){ n.hidden=false; }
  }

  // defaults
  function ensureDefaults(){
    if(!state.lists.known_for || !state.lists.known_for.length){
      state.lists.known_for = ["","","",""];
    }
    if(!state.competitors || !state.competitors.length){
      state.competitors = [{name:"",likes:""},{name:"",likes:""},{name:"",likes:""}];
    }
  }

  // ---------- helpers ----------
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

  function fieldHTML(f){
    var id="f_"+f.k;
    var reqBadge = f.required ? '<span class="req">Required</span>' : '';
    var help = f.help ? '<p class="help">'+esc(f.help)+'</p>' : '';
    var err = f.required ? '<div class="err">Please fill this in to continue.</div>' : '';
    if(f.type==="list"){
      var rows = (state.lists[f.k]||[""]).map(function(v,i){ return listRowHTML(f,v,i); }).join("");
      var count=(state.lists[f.k]||[]).length;
      return '<div class="field" data-field="'+f.k+'">'
        +'<label class="q">'+esc(f.q)+reqBadge+'</label>'+help
        +'<div class="listwrap" data-list="'+f.k+'">'+rows+'</div>'
        +'<button type="button" class="addbtn" data-add="'+f.k+'"'+(count>=f.max?' disabled':'')+'>+ Add another</button>'
        +err+'</div>';
    }
    var val = esc(state.fields[f.k]||"");
    var ph = f.ph?' placeholder="'+esc(f.ph)+'"':'';
    if(f.type==="text"){
      return '<div class="field" data-field="'+f.k+'"><label class="q" for="'+id+'">'+esc(f.q)+reqBadge+'</label>'+help
        +'<input type="text" id="'+id+'" data-k="'+f.k+'" value="'+val+'"'+ph+'>'+err+'</div>';
    }
    if(f.type==="email"){
      return '<div class="field" data-field="'+f.k+'"><label class="q" for="'+id+'">'+esc(f.q)+reqBadge+'</label>'+help
        +'<input type="email" id="'+id+'" data-k="'+f.k+'" value="'+val+'"'+ph+'>'+err+'</div>';
    }
    var cls = f.type==="long"?"long":"";
    return '<div class="field" data-field="'+f.k+'"><label class="q" for="'+id+'">'+esc(f.q)+reqBadge+'</label>'+help
      +'<textarea id="'+id+'" class="'+cls+'" data-k="'+f.k+'"'+ph+'>'+val+'</textarea>'+err+'</div>';
  }
  function listRowHTML(f,v,i){
    return '<div class="listrow"><span class="dot">'+(i+1)+'</span>'
      +'<input type="text" data-listk="'+f.k+'" data-idx="'+i+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>'
      +'<button type="button" class="iconbtn" data-rm="'+f.k+'" data-idx="'+i+'" aria-label="Remove">×</button></div>';
  }
  function compCardHTML(c,i){
    return '<div class="compcard" data-comp="'+i+'">'
      +'<div class="ch"><span class="cn">Competitor '+(i+1)+'</span>'
      +(i>0?'<button type="button" class="iconbtn" data-rmcomp="'+i+'" aria-label="Remove">×</button>':'')+'</div>'
      +'<input type="text" data-compk="name" data-idx="'+i+'" value="'+esc(c.name)+'" placeholder="Name / handle">'
      +'<label class="mini">5 things you like about them</label>'
      +'<textarea data-compk="likes" data-idx="'+i+'" placeholder="What they do well…">'+esc(c.likes)+'</textarea>'
      +'</div>';
  }

  // ---------- renderers ----------
  function renderWelcome(){
    return ''
      +'<div class="hero">'
        +'<svg class="crest lg" viewBox="0 0 64 64" aria-hidden="true" fill="none"><circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.2"/><circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="0.6" opacity="0.5"/><text x="32" y="41.5" text-anchor="middle" font-family="EB Garamond, serif" font-size="27" font-style="italic" fill="currentColor">M</text><text x="43.5" y="27" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" font-style="italic" fill="currentColor">é</text></svg>'
        +'<div class="eyebrow"><span class="bar"></span> Client Brand Sheet <span class="bar"></span></div>'
        +'<h1>Let’s build <em>your</em> brand.</h1>'
        +'<p>A short, guided discovery. Answer honestly — the sharper your answers, the sharper the strategy we build around you.</p>'
        +'<div class="meta">'
          +'<div class="m"><div class="mv">6</div><div class="ml">Chapters</div></div>'
          +'<div class="m"><div class="mv">≈10</div><div class="ml">Minutes</div></div>'
          +'<div class="m"><div class="mv">✓</div><div class="ml">Auto-saves</div></div>'
        +'</div>'
      +'</div>'
      +'<div class="intro-video" id="introVideo" hidden>'
        +'<video id="introVid" playsinline controls preload="metadata" poster="/media/welcome-poster.jpg">'
          +'<source src="/v/brand-intro" type="video/mp4">'
        +'</video>'
      +'</div>'
      +'<div class="card">'
        +'<div class="card-h">First, your details</div>'
        +'<div class="fields">'
          +fieldHTML({k:"client_name", q:"Your name", type:"text", required:true, ph:"First & last"})
          +fieldHTML({k:"brand_name", q:"Brand / business name", type:"text", ph:"If you have one"})
          +fieldHTML({k:"client_email", q:"Your email", type:"email", required:true, help:"So we can follow up with you directly.", ph:"you@email.com"})
        +'</div>'
      +'</div>'
      +'<p class="about">Everything you type is saved on this device as you go — you can close the tab and pick up where you left off.</p>';
  }

  function renderChapter(ch){
    var head = '<div class="eyebrow"><span class="no">'+ch.no+'</span><span class="bar"></span>'+esc(ch.kicker)+'</div>'
      +'<h1 class="chapter">'+esc(ch.title)+'</h1>'
      +(ch.lede?'<p class="lede">'+ch.lede+'</p>':'');
    var body="";
    if(ch.type==="competitors"){
      body = '<div class="fields"><div class="compwrap" data-compwrap>'
        + state.competitors.map(function(c,i){return compCardHTML(c,i);}).join("")
        + '</div><button type="button" class="addbtn" data-addcomp'+(state.competitors.length>=6?' disabled':'')+'>+ Add competitor</button></div>';
    } else if(ch.groups){
      body = ch.groups.map(function(g){
        var gh = g.h?'<div class="group-h">'+esc(g.h)+'</div>':'';
        return '<div class="group">'+gh+'<div class="fields">'+g.fields.map(fieldHTML).join("")+'</div></div>';
      }).join("");
    } else {
      body = '<div class="fields">'+ch.fields.map(fieldHTML).join("")+'</div>';
    }
    return head+body;
  }

  function renderReview(){
    var secs = buildSections();
    var html = '<div class="eyebrow"><span class="no">✓</span><span class="bar"></span>Final look</div>'
      +'<h1 class="chapter">Review & send</h1>'
      +'<p class="lede">Give it a once-over. You can jump back into any section — nothing sends until you hit <em>Send my brand sheet</em>.</p>'
      +'<div style="margin-top:30px">';
    secs.forEach(function(s){
      html += '<div class="rev-sec"><div class="rev-head"><h3>'+esc(s.title)+'</h3>'
        + (s.step!=null?'<button class="rev-edit" type="button" data-goto="'+s.step+'">Edit</button>':'')
        +'</div>';
      s.items.forEach(function(it){
        var v=(it.value||"").trim();
        html += '<div class="rev-item"><span class="rl">'+esc(it.label)+'</span>'
          + '<span class="rv'+(v?'':' empty')+'">'+(v?esc(v):"— not answered")+'</span></div>';
      });
      html += '</div>';
    });
    html += '</div>'
      + '<div class="status err" id="status"></div>'
      + '<div class="fallback" id="fallback" hidden>'
        + '<p class="help" style="margin-bottom:8px">Couldn’t send automatically. Copy everything below and email it to us — nothing is lost.</p>'
        + '<textarea id="fallbackText" readonly></textarea>'
        + '<button type="button" class="btn btn-ghost" id="copyBtn" style="margin-top:10px">Copy all answers</button>'
      + '</div>';
    return html;
  }

  function renderDone(){
    document.getElementById("navbar").hidden=true;
    var redir = REDIRECT_SECONDS>0
      ? '<p class="redir">Taking you to book your call in <span id="cd">'+REDIRECT_SECONDS+'</span>s · <a id="stay">stay here</a></p>'
      : '';
    return '<div class="done">'
      +'<svg class="crest lg" viewBox="0 0 64 64" aria-hidden="true" fill="none" style="color:var(--gold)"><circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.2"/><circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="0.6" opacity="0.5"/><text x="32" y="41.5" text-anchor="middle" font-family="EB Garamond, serif" font-size="27" font-style="italic" fill="currentColor">M</text><text x="43.5" y="27" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" font-style="italic" fill="currentColor">é</text></svg>'
      +'<h1>Received. Thank you.</h1>'
      +'<p>Your brand sheet is on its way to the Maison d’Élites team. The natural next step is a call — let’s turn these answers into a plan.</p>'
      +'<div class="cta-row">'
        +'<a class="btn btn-primary wide" href="'+BOOK_URL+'">Book your discovery call →</a>'
        + redir
      +'</div>'
      +'</div>';
  }
  function startRedirect(){
    if(REDIRECT_SECONDS<=0) return;
    var left=REDIRECT_SECONDS, cd=document.getElementById("cd"), stay=document.getElementById("stay"), stopped=false;
    if(stay) stay.onclick=function(){ stopped=true; var r=document.querySelector(".done .redir"); if(r) r.textContent="You can book whenever you’re ready."; };
    var t=setInterval(function(){
      if(stopped){ clearInterval(t); return; }
      left--; if(cd) cd.textContent=left;
      if(left<=0){ clearInterval(t); if(!stopped) window.location.href=BOOK_URL; }
    },1000);
  }

  // ---------- build ordered sections (for review + payload) ----------
  function buildSections(){
    var out=[];
    // details
    out.push({ title:"Your details", step:0, items:[
      {label:"Name", value:state.fields.client_name},
      {label:"Brand / business", value:state.fields.brand_name},
      {label:"Email", value:state.fields.client_email}
    ]});
    CHAPTERS.forEach(function(ch,ci){
      var items=[];
      if(ch.type==="competitors"){
        state.competitors.forEach(function(c,i){
          if((c.name||"").trim()||(c.likes||"").trim()){
            items.push({label:"Competitor "+(i+1)+(c.name?" — "+c.name:""), value:c.likes});
          }
        });
        if(!items.length) items.push({label:"Competitors", value:""});
      } else if(ch.groups){
        ch.groups.forEach(function(g){
          g.fields.forEach(function(f){ items.push({label:(g.h?g.h+" · ":"")+f.q, value:valueOf(f)}); });
        });
      } else {
        ch.fields.forEach(function(f){ items.push({label:f.q, value:valueOf(f)}); });
      }
      out.push({ title:ch.no+".  "+ch.title, step:ci+1, items:items });
    });
    return out;
  }
  function valueOf(f){
    if(f.type==="list"){ return (state.lists[f.k]||[]).filter(function(v){return String(v).trim();}).join("\n"); }
    return state.fields[f.k]||"";
  }

  // ---------- validation ----------
  function requiredFor(step){
    if(step===0) return ["client_name","client_email"];
    return [];
  }
  function validateStep(step){
    var ok=true;
    requiredFor(step).forEach(function(k){
      var wrap=document.querySelector('.field[data-field="'+k+'"]');
      var v=(state.fields[k]||"").trim();
      var valid = v.length>0 && (k!=="client_email" || /.+@.+\..+/.test(v));
      if(wrap){ wrap.classList.toggle("invalid", !valid); }
      if(!valid) ok=false;
    });
    return ok;
  }

  // ---------- navigation ----------
  function render(){
    var stage=document.getElementById("stage");
    var html;
    if(stepIndex===0) html=renderWelcome();
    else if(stepIndex<=CHAPTERS.length) html=renderChapter(CHAPTERS[stepIndex-1]);
    else html=renderReview();
    stage.innerHTML=html;

    // nav + progress
    var nb=document.getElementById("navbar"); nb.hidden=false;
    var back=document.getElementById("backBtn"), next=document.getElementById("nextBtn");
    back.style.visibility = stepIndex===0 ? "hidden" : "visible";
    if(stepIndex===0) next.textContent="Begin";
    else if(stepIndex>CHAPTERS.length){ next.innerHTML="Send my brand sheet"; }
    else next.textContent="Continue";
    var pct = Math.round((stepIndex/(TOTAL-1))*100);
    document.getElementById("pfill").style.width=pct+"%";
    var label = stepIndex===0 ? "Welcome" : (stepIndex>CHAPTERS.length ? "Review" : "Chapter "+stepIndex+" of "+CHAPTERS.length);
    document.getElementById("stepcount").textContent=label;
    window.scrollTo({top:0, behavior:"instant" in document.documentElement.style?"instant":"auto"});
    // focus first control
    var first=stage.querySelector("input,textarea,button.rev-edit");
    if(first && stepIndex!==0 && first.focus) { try{first.focus({preventScroll:true});}catch(e){} }
    if(stepIndex===0) wireIntroVideo();
  }

  // Show the welcome video only if one has actually been uploaded to /v/brand-intro.
  // If it 404s, the <video> fires 'error' and the frame stays hidden.
  function wireIntroVideo(){
    var box=document.getElementById("introVideo"), vid=document.getElementById("introVid");
    if(!box||!vid) return;
    vid.addEventListener("loadedmetadata", function(){ box.hidden=false; }, {once:true});
    vid.addEventListener("error", function(){ box.hidden=true; }, {once:true});
    try{ vid.load(); }catch(e){}
  }

  function next(){
    if(!validateStep(stepIndex)){
      var bad=document.querySelector(".field.invalid input,.field.invalid textarea");
      if(bad) bad.focus();
      return;
    }
    if(stepIndex>CHAPTERS.length){ submit(); return; }
    stepIndex++; render();
  }
  function back(){ if(stepIndex>0){ stepIndex--; render(); } }
  function goto(i){ stepIndex=i; render(); }

  // ---------- submit ----------
  function plainText(){
    var lines=["MAISON D’ÉLITES — BRAND SHEET","", "Submitted: "+new Date().toLocaleString(),""];
    buildSections().forEach(function(s){
      lines.push("─── "+s.title.toUpperCase()+" ───");
      s.items.forEach(function(it){
        lines.push(it.label+":");
        lines.push("  "+((it.value||"").trim()||"—"));
        lines.push("");
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  function submit(){
    var next=document.getElementById("nextBtn");
    var status=document.getElementById("status");
    var fb=document.getElementById("fallback");
    next.disabled=true; next.innerHTML='<span class="spin"></span> Sending…';
    if(status){status.className="status err";status.classList.remove("show");}

    var payload={
      type:"brandsheet",
      client_name:state.fields.client_name||"",
      brand_name:state.fields.brand_name||"",
      client_email:state.fields.client_email||"",
      sections:buildSections().map(function(s){return {title:s.title, items:s.items.map(function(it){return {label:it.label, value:(it.value||"").trim()};})};}),
      submittedAt:new Date().toISOString()
    };

    fetch(ENDPOINT,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){ return r.ok ? r.json().catch(function(){return {ok:true};}) : Promise.reject(new Error("HTTP "+r.status)); })
      .then(function(res){
        if(res && res.ok===false) throw new Error(res.error||"send failed");
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        document.getElementById("stage").innerHTML=renderDone();
        document.getElementById("pfill").style.width="100%";
        document.getElementById("stepcount").textContent="Complete";
        window.scrollTo(0,0); startRedirect();
      })
      .catch(function(err){
        next.disabled=false; next.innerHTML="Send my brand sheet";
        if(status){ status.textContent="We couldn’t send it automatically ("+err.message+"). Your answers are safe — copy them below and email us."; status.classList.add("show"); }
        if(fb){ fb.hidden=false; var t=document.getElementById("fallbackText"); if(t) t.value=plainText(); }
        var cb=document.getElementById("copyBtn");
        if(cb) cb.onclick=function(){ var t=document.getElementById("fallbackText"); t.select();
          try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand("copy"); }
          cb.textContent="Copied ✓"; setTimeout(function(){cb.textContent="Copy all answers";},1800); };
        fb&&fb.scrollIntoView({behavior:"smooth"});
      });
  }

  // ---------- events (delegation on stage) ----------
  var stage=document.getElementById("stage");
  stage.addEventListener("input", function(e){
    var t=e.target;
    if(t.dataset.k!=null){ state.fields[t.dataset.k]=t.value; scheduleSave();
      var wrap=t.closest(".field"); if(wrap&&wrap.classList.contains("invalid")) validateStep(stepIndex); }
    else if(t.dataset.listk!=null){ var k=t.dataset.listk, i=+t.dataset.idx; state.lists[k]=state.lists[k]||[]; state.lists[k][i]=t.value; scheduleSave(); }
    else if(t.dataset.compk!=null){ var ci=+t.dataset.idx; state.competitors[ci]=state.competitors[ci]||{name:"",likes:""}; state.competitors[ci][t.dataset.compk]=t.value; scheduleSave(); }
  });
  stage.addEventListener("click", function(e){
    var t=e.target.closest("[data-add],[data-rm],[data-addcomp],[data-rmcomp],[data-goto]");
    if(!t) return;
    if(t.hasAttribute("data-add")){ var k=t.getAttribute("data-add"); readListDOM(); state.lists[k]=state.lists[k]||[]; if(state.lists[k].length< (findList(k).max||7)){ state.lists[k].push(""); save(); render(); } }
    else if(t.hasAttribute("data-rm")){ var kk=t.getAttribute("data-rm"), idx=+t.getAttribute("data-idx"); readListDOM(); state.lists[kk].splice(idx,1); if(!state.lists[kk].length) state.lists[kk].push(""); save(); render(); }
    else if(t.hasAttribute("data-addcomp")){ readCompDOM(); if(state.competitors.length<6){ state.competitors.push({name:"",likes:""}); save(); render(); } }
    else if(t.hasAttribute("data-rmcomp")){ var cidx=+t.getAttribute("data-rmcomp"); readCompDOM(); state.competitors.splice(cidx,1); if(!state.competitors.length) state.competitors.push({name:"",likes:""}); save(); render(); }
    else if(t.hasAttribute("data-goto")){ goto(+t.getAttribute("data-goto")); }
  });
  function findList(k){ for(var i=0;i<CHAPTERS.length;i++){ var ch=CHAPTERS[i]; var fs=ch.fields||[]; for(var j=0;j<fs.length;j++) if(fs[j].k===k) return fs[j]; } return {}; }
  function readListDOM(){ document.querySelectorAll('input[data-listk]').forEach(function(inp){ var k=inp.dataset.listk,i=+inp.dataset.idx; state.lists[k]=state.lists[k]||[]; state.lists[k][i]=inp.value; }); }
  function readCompDOM(){ document.querySelectorAll('[data-compk]').forEach(function(inp){ var i=+inp.dataset.idx; state.competitors[i]=state.competitors[i]||{name:"",likes:""}; state.competitors[i][inp.dataset.compk]=inp.value; }); }

  var st=null; function scheduleSave(){ if(st) clearTimeout(st); st=setTimeout(save,400); }

  document.getElementById("nextBtn").addEventListener("click", next);
  document.getElementById("backBtn").addEventListener("click", back);
  document.addEventListener("keydown", function(e){
    if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); next(); }
  });

  // ---------- boot ----------
  loadSaved(); ensureDefaults(); render();
})();
</script>
</body>
</html>
