<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your discovery call · Maison d'Élites</title>
<style>
  :root{--ink:#1a140d;--cream:#f7f2e9;--gold:#c7a867;--gold-bright:#e6c984;--line:rgba(199,168,103,.28)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#0e0b07;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:40px 18px 56px;text-align:center}
  .eyebrow{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 14px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:2rem;line-height:1.15;margin:0 0 12px}
  h1 em{color:var(--gold-bright);font-style:italic}
  .lead{color:#cfc6b3;max-width:520px;margin:0 auto 28px;font-size:1.02rem;line-height:1.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px -30px rgba(0,0,0,.7)}
  #embed{min-width:320px;min-height:700px}
  .calendly-inline-widget{min-width:320px;height:780px}
  .fallback{margin-top:22px;font-size:.86rem;color:#8c8474}
  .fallback a{color:var(--gold);text-underline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Maison d'Élites</p>
    <h1>Book your <em>discovery call</em></h1>
    <p class="lead">Pick a time that works for you. It's a short call to confirm we're the right fit before your main strategy session.</p>

    <div class="card">
      <div id="embed"></div>
    </div>

    <p class="fallback" id="fallback"></p>
  </div>

  <script>
  (function(){
    // ── Paste your Cal.com booking link here to switch over (e.g. "jacques/discovery-call").
    //    While this is empty, the page uses the existing Calendly embed.
    var CAL_LINK  = "maison-d-elites-tvxf8y/discovery-call";
    var CALENDLY  = "https://calendly.com/jacques-maisondelitesagency/discovery-call";

    var embed = document.getElementById('embed');
    var fallback = document.getElementById('fallback');

    function goHome(){ setTimeout(function(){ window.location.href = '/booked'; }, 1200); }

    if (CAL_LINK) {
      // ── Cal.com: native questions (no double entry) + server-side webhook → Discord ──
      (function (C, A, L) {
        var p = function (a, ar) { a.q.push(ar); };
        var d = C.document;
        C.Cal = C.Cal || function () {
          var cal = C.Cal; var ar = arguments;
          if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; }
          if (ar[0] === L) {
            var api = function () { p(api, arguments); };
            var namespace = ar[1]; api.q = api.q || [];
            if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); }
            else p(cal, ar);
            return;
          }
          p(cal, ar);
        };
      })(window, "https://app.cal.com/embed/embed.js", "init");

      Cal("init", { origin: "https://cal.com" });
      Cal("inline", { elementOrSelector: "#embed", calLink: CAL_LINK, layout: "month_view" });
      Cal("ui", { hideEventTypeDetails: false, layout: "month_view",
        cssVarsPerTheme: { light: { "cal-brand": "#c7a867" }, dark: { "cal-brand": "#c7a867" } } });
      // The Discord ping is handled server-side by Cal.com's webhook; just send them home.
      Cal("on", { action: "bookingSuccessful", callback: goHome });

      fallback.innerHTML = "Trouble with the calendar? <a href='https://cal.com/" + CAL_LINK + "' target='_blank' rel='noopener'>Open it directly &rarr;</a>";

    } else {
      // ── Calendly fallback: reliable inline embed (no custom form, so no double name) ──
      var w = document.createElement('div');
      w.className = 'calendly-inline-widget';
      w.setAttribute('data-url', CALENDLY + '?hide_gdpr_banner=1&primary_color=c7a867');
      embed.appendChild(w);

      var s = document.createElement('script');
      s.src = 'https://assets.calendly.com/assets/external/widget.js';
      s.async = true;
      document.body.appendChild(s);

      fallback.innerHTML = "Trouble with the calendar? <a href='" + CALENDLY + "' target='_blank' rel='noopener'>Open it directly &rarr;</a>";

      // Generic Discord ping on booking (details live in Calendly until we switch to Cal.com).
      window.addEventListener('message', function(e){
        if (e && e.origin && e.origin.indexOf('calendly.com') > -1
            && e.data && e.data.event === 'calendly.event_scheduled') {
          try {
            var body = JSON.stringify({ note: '' });
            if (navigator.sendBeacon) navigator.sendBeacon('/api/notify', new Blob([body], { type:'application/json' }));
            else fetch('/api/notify', { method:'POST', headers:{'content-type':'application/json'}, body:body, keepalive:true }).catch(function(){});
          } catch(err) {}
          goHome();
        }
      });
    }
  })();
  </script>
</body>
</html>
