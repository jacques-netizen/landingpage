<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your discovery call · Maison d'Élites</title>
<style>
  :root{--ink:#1a140d;--cream:#f7f2e9;--gold:#c7a867;--gold-bright:#e6c984;--line:rgba(199,168,103,.28)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#0e0b07;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:40px 18px 56px;text-align:center}
  .eyebrow{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 14px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:2rem;line-height:1.15;margin:0 0 12px}
  h1 em{color:var(--gold-bright);font-style:italic}
  .lead{color:#cfc6b3;max-width:480px;margin:0 auto 28px;font-size:1.02rem;line-height:1.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px -30px rgba(0,0,0,.7)}
  .calendly-inline-widget{min-width:320px;height:780px}
  .fallback{margin-top:22px;font-size:.86rem;color:#8c8474}
  .fallback a{color:var(--gold);text-underline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Maison d'Élites</p>
    <h1>Book your <em>discovery call</em></h1>
    <p class="lead">Pick a time that works for you. It's a short call to confirm we're the right fit before your main strategy session.</p>

    <div class="card">
      <!-- Calendly inline embed -->
      <div class="calendly-inline-widget"
           data-url="https://calendly.com/jacques-maisondelitesagency/discovery-call?hide_gdpr_banner=1&primary_color=c7a867"></div>
    </div>

    <p class="fallback">Trouble with the calendar above?
      <a href="https://calendly.com/jacques-maisondelitesagency/discovery-call" target="_blank" rel="noopener">Open it directly &rarr;</a>
    </p>
  </div>

  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <script>
    // When the visitor finishes booking, Calendly posts a message to this page.
    // We listen for it and send them straight to the landing page.
    function isCalendlyEvent(e){
      return e && e.origin && e.origin.indexOf('calendly.com') > -1
        && e.data && typeof e.data.event === 'string';
    }
    function notifyBooking(){
      try {
        var body = JSON.stringify({ note: '' });
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/notify', new Blob([body], { type: 'application/json' }));
        } else {
          fetch('/api/notify', { method:'POST', headers:{'content-type':'application/json'}, body: body, keepalive: true }).catch(function(){});
        }
      } catch (e) { /* never block the redirect */ }
    }
    window.addEventListener('message', function(e){
      if (isCalendlyEvent(e) && e.data.event === 'calendly.event_scheduled') {
        notifyBooking();
        // small delay so Calendly finishes its own confirmation step cleanly
        setTimeout(function(){ window.location.href = '/'; }, 600);
      }
    });
  </script>
</body>
</html>
