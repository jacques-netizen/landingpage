<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Campaign Editor · Maison d'Élites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0f;--ink-card:#141318;
  --gold:#a88a4f;--gold-light:#c7a867;--gold-bright:#e6c984;
  --text-cream:#e8e3d6;--text-mute:#9b9484;--text-dim:#6f6a5e;
  --hair:rgba(232,227,214,0.12);--hair-mid:rgba(232,227,214,0.22);
  --ok:#6fb98a;--bad:#d2766a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',sans-serif;background:var(--ink);color:var(--text-cream);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}

.topbar{border-bottom:1px solid var(--hair);padding:1.1rem 0;margin-bottom:2.6rem}
.topbar-in{display:flex;align-items:center;justify-content:space-between}
.mark{font-family:'EB Garamond',serif;font-size:1.18rem;letter-spacing:.03em}
.mark b{color:var(--gold-light);font-weight:500}
.top-right{font-size:.78rem;display:flex;gap:1.2rem}
.top-right a{color:var(--text-mute);text-decoration:none}
.top-right a:hover{color:var(--gold-light)}

/* gate */
.gate{max-width:340px;margin:10vh auto 0;background:var(--ink-card);border:1px solid var(--hair);border-radius:16px;padding:2rem}
.gate h2{font-family:'EB Garamond',serif;font-size:1.5rem;font-weight:400;margin-bottom:1.4rem}
input[type=password]{width:100%;padding:.75rem 1rem;background:#0a0a0c;border:1px solid var(--hair-mid);border-radius:9px;color:var(--text-cream);font-size:.95rem;font-family:inherit;outline:none;transition:.15s border-color}
input[type=password]:focus{border-color:var(--gold)}
.err{font-size:.8rem;color:var(--bad);min-height:1.1em;margin-top:.4rem}
.btn{display:block;width:100%;padding:.8rem;background:var(--gold);color:#1a1208;border:0;border-radius:9px;font-family:inherit;font-weight:600;font-size:.9rem;cursor:pointer;margin-top:1rem;transition:.15s}
.btn:hover{background:var(--gold-bright)}

/* app */
.stack{display:flex;flex-direction:column;gap:1.1rem;padding-bottom:3rem}

/* zone */
.zone{
  border:2px dashed var(--hair-mid);border-radius:16px;
  padding:3.6rem 2rem;text-align:center;cursor:pointer;
  transition:.2s;position:relative;
}
.zone:hover,.zone.over{border-color:var(--gold);background:rgba(168,138,79,.05)}
.zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.zone-arrow{font-size:2rem;color:var(--gold);opacity:.7;margin-bottom:.9rem}
.zone h2{font-family:'EB Garamond',serif;font-size:1.7rem;font-weight:400;margin-bottom:.35rem}
.zone p{font-size:.83rem;color:var(--text-mute)}
.zone-file{font-size:.82rem;color:var(--gold-light);margin-top:.65rem;font-weight:500;min-height:1.2em}

/* result */
.result{border-radius:12px;padding:1.2rem 1.4rem;display:none}
.result.ok{background:rgba(111,185,138,.1);border:1px solid rgba(111,185,138,.28)}
.result.err{background:rgba(210,118,106,.08);border:1px solid rgba(210,118,106,.28)}
.result-title{font-size:.83rem;font-weight:600;margin-bottom:.3rem}
.result.ok .result-title{color:var(--ok)}
.result.err .result-title{color:var(--bad)}
.result-body{font-size:.82rem;color:var(--text-mute)}
.dash-link{display:inline-block;margin-top:.85rem;padding:.5rem 1.1rem;background:var(--gold);color:#1a1208;border-radius:8px;font-size:.8rem;font-weight:600;text-decoration:none}
.dash-link:hover{background:var(--gold-bright)}

/* settings */
details{background:var(--ink-card);border:1px solid var(--hair);border-radius:12px}
summary{padding:1rem 1.2rem;cursor:pointer;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:'›';font-size:1rem;color:var(--text-dim)}
details[open] summary::after{transform:rotate(90deg)}
.settings-body{padding:0 1.2rem 1.2rem;display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.sf{display:flex;flex-direction:column;gap:.35rem}
.sf.full{grid-column:1/-1}
.sf label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.sf input{padding:.6rem .85rem;background:#0a0a0c;border:1px solid var(--hair-mid);border-radius:8px;color:var(--text-cream);font-size:.88rem;font-family:inherit;outline:none;transition:.15s}
.sf input:focus{border-color:var(--gold)}

@media(max-width:460px){.settings-body{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-in">
    <div class="mark">Maison <b>d'Élites</b></div>
    <div class="top-right" id="topRight" style="display:none">
      <a href="/dashboard" target="_blank">Live dashboard ↗</a>
      <a href="#" id="lockBtn">Lock</a>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- Gate -->
  <div id="gate" style="display:none">
    <div class="gate">
      <h2>Campaign editor</h2>
      <input id="pwInput" type="password" placeholder="Admin password" autocomplete="current-password">
      <div class="err" id="gateErr"></div>
      <button class="btn" id="unlockBtn">Unlock</button>
    </div>
  </div>

  <!-- App -->
  <div id="app" style="display:none">
    <div class="stack">

      <!-- Upload zone -->
      <div class="zone" id="zone">
        <input type="file" id="fileInput" accept=".csv,text/csv,text/plain">
        <div class="zone-arrow">↑</div>
        <h2>Drop your CSV file here</h2>
        <p>or click to browse · any export format works</p>
        <div class="zone-file" id="fileName"></div>
      </div>

      <!-- Result -->
      <div class="result" id="result">
        <div class="result-title" id="rTitle"></div>
        <div class="result-body" id="rBody"></div>
        <a class="dash-link" href="/dashboard" target="_blank" id="rLink" style="display:none">View live dashboard ↗</a>
      </div>

      <!-- Campaign settings (collapsed by default) -->
      <details>
        <summary>Campaign settings</summary>
        <div class="settings-body">
          <div class="sf">
            <label>Artist / client</label>
            <input id="sClient" type="text" value="Itzdanielmichael">
          </div>
          <div class="sf">
            <label>Campaign title</label>
            <input id="sCampaign" type="text" value="Need You · Please Stay">
          </div>
          <div class="sf">
            <label>Budget ($)</label>
            <input id="sBudget" type="number" min="0" value="1000">
          </div>
          <div class="sf">
            <label>Budget spent ($)</label>
            <input id="sSpent" type="number" min="0" placeholder="0">
          </div>
          <div class="sf full">
            <label>Guarantee floor (views · leave blank if none)</label>
            <input id="sFloor" type="number" min="0" placeholder="e.g. 1500000">
          </div>
        </div>
      </details>

    </div>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);
const pw = () => sessionStorage.getItem('mde_pw') || '';
const setPw = v => sessionStorage.setItem('mde_pw', v);
const clrPw = () => sessionStorage.removeItem('mde_pw');

function fmt(n){
  n=Number(n)||0;
  if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return String(Math.round(n));
}

function showGate(msg){
  $('#gate').style.display=''; $('#app').style.display='none';
  $('#topRight').style.display='none';
  $('#gateErr').textContent=msg||'';
  setTimeout(()=>$('#pwInput').focus(),40);
}
function showApp(){ $('#gate').style.display='none'; $('#app').style.display=''; $('#topRight').style.display=''; }

function setResult(kind, title, body, link){
  const r=$('#result'); r.className='result '+kind; r.style.display='';
  $('#rTitle').textContent=title; $('#rBody').textContent=body;
  $('#rLink').style.display=link?'':'none';
}

async function upload(file){
  if(!file) return;
  $('#fileName').textContent=file.name;
  setResult('ok','Uploading…','',false);

  const csv = await file.text();
  const body = {
    csv,
    client:  $('#sClient').value.trim()||'Itzdanielmichael',
    campaign:$('#sCampaign').value.trim()||'Need You · Please Stay',
    budgetTotal: Number($('#sBudget').value)||1000,
    budgetSpent: Number($('#sSpent').value)||0,
    guaranteeFloor: Number($('#sFloor').value)||0,
    tagline: 'Live distribution across our creator network',
  };

  try{
    const r = await fetch('/api/campaign/import',{
      method:'POST',
      headers:{'Authorization':'Bearer '+pw(),'content-type':'application/json'},
      body:JSON.stringify(body),
    });
    if(r.status===401){ clrPw(); showGate('Session expired.'); return; }
    const j = await r.json();
    if(!r.ok){ setResult('err','Upload failed',j.error||'Check your CSV and try again.',false); return; }
    setResult('ok','✓ Dashboard updated',
      (j.imported||0)+' clips · '+fmt(j.views||0)+' views',true);
  }catch(e){
    setResult('err','Upload failed',String(e.message||e),false);
  }
}

$('#fileInput').addEventListener('change', e=>{ if(e.target.files[0]) upload(e.target.files[0]); });

const zone=$('#zone');
zone.addEventListener('dragover', e=>{e.preventDefault();zone.classList.add('over');});
zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
zone.addEventListener('drop', e=>{
  e.preventDefault(); zone.classList.remove('over');
  if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});

$('#unlockBtn').addEventListener('click', async()=>{
  const v=$('#pwInput').value.trim(); if(!v) return;
  setPw(v); $('#pwInput').value='';
  try{
    const r=await fetch('/api/campaign',{headers:{'Authorization':'Bearer '+v},cache:'no-store'});
    if(r.status===401){clrPw();showGate('Wrong password.');} else showApp();
  }catch(e){showGate('Network error.');}
});
$('#pwInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#unlockBtn').click(); });
$('#lockBtn').addEventListener('click',e=>{ e.preventDefault(); clrPw(); showGate('Locked.'); });

if(pw()){
  fetch('/api/campaign',{headers:{'Authorization':'Bearer '+pw()},cache:'no-store'})
    .then(r=>{ if(r.status===401){clrPw();showGate();}else showApp(); })
    .catch(()=>showGate('Network error.'));
}else{ showGate(); }
</script>
</body>
</html>
