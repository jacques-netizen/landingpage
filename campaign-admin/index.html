<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Campaign Editor · Maison d'Élites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0f;
  --ink-card:#141318;
  --cream:#f4f1ea;
  --gold:#a88a4f;
  --gold-light:#c7a867;
  --gold-bright:#e6c984;
  --text-cream:#e8e3d6;
  --text-mute:#9b9484;
  --text-dim:#6f6a5e;
  --hair:rgba(232,227,214,0.12);
  --hair-mid:rgba(232,227,214,0.2);
  --ok:#6fb98a;
  --bad:#d2766a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Archivo',sans-serif;
  background:var(--ink);
  color:var(--text-cream);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.display{font-family:'EB Garamond',serif}
.wrap{max-width:640px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2rem)}

/* topbar */
.topbar{border-bottom:1px solid var(--hair);padding:1.1rem 0;margin-bottom:2.4rem}
.topbar-in{display:flex;align-items:center;justify-content:space-between}
.mark{font-family:'EB Garamond',serif;font-size:1.18rem;letter-spacing:.03em}
.mark b{color:var(--gold-light);font-weight:500}
.top-links{display:flex;gap:1.2rem;font-size:.78rem}
.top-links a{color:var(--text-mute);text-decoration:none;letter-spacing:.04em}
.top-links a:hover{color:var(--gold-light)}

/* gate */
.gate{max-width:360px;margin:12vh auto 0;background:var(--ink-card);border:1px solid var(--hair);border-radius:16px;padding:2rem}
.gate-title{font-family:'EB Garamond',serif;font-size:1.5rem;font-weight:400;margin-bottom:1.4rem}
label{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute);margin-bottom:.4rem}
input[type=password],input[type=text],input[type=number]{
  width:100%;padding:.75rem 1rem;background:#0a0a0c;border:1px solid var(--hair-mid);
  border-radius:9px;color:var(--text-cream);font-size:.95rem;font-family:inherit;outline:none;
  transition:.15s border-color;
}
input:focus{border-color:var(--gold)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  cursor:pointer;border:0;border-radius:9px;font-weight:600;font-size:.9rem;
  padding:.8rem 1.4rem;background:var(--gold);color:#1a1208;
  font-family:inherit;transition:.15s;width:100%;margin-top:1rem;
}
.btn:hover{background:var(--gold-bright)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--hair-mid)}
.btn.ghost:hover{border-color:var(--gold)}
.err-msg{font-size:.8rem;color:var(--bad);margin-top:.5rem;min-height:1.1em}

/* settings card */
.card{background:var(--ink-card);border:1px solid var(--hair);border-radius:14px;padding:1.4rem}
.card-title{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:1.1rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.field.full{grid-column:1/-1}
.field label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute);margin:0}
.field input{padding:.6rem .9rem;font-size:.88rem}

/* upload zone */
.zone{
  border:2px dashed var(--hair-mid);border-radius:16px;
  padding:3.5rem 2rem;text-align:center;cursor:pointer;
  transition:.2s border-color,.2s background;
  position:relative;
}
.zone:hover,.zone.over{border-color:var(--gold);background:rgba(168,138,79,.06)}
.zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.zone-icon{font-size:2.2rem;margin-bottom:1rem;color:var(--gold);opacity:.7}
.zone-head{font-family:'EB Garamond',serif;font-size:1.6rem;font-weight:400;color:var(--text-cream);margin-bottom:.4rem}
.zone-sub{font-size:.82rem;color:var(--text-mute);font-weight:300}
.zone-name{font-size:.82rem;color:var(--gold-light);margin-top:.7rem;font-weight:500}

/* status */
.status{border-radius:14px;padding:1.4rem 1.6rem;display:none}
.status.ok{background:rgba(111,185,138,.1);border:1px solid rgba(111,185,138,.3)}
.status.err{background:rgba(210,118,106,.08);border:1px solid rgba(210,118,106,.3)}
.status-head{font-size:.82rem;font-weight:600;margin-bottom:.5rem}
.status.ok .status-head{color:var(--ok)}
.status.err .status-head{color:var(--bad)}
.status-body{font-size:.82rem;color:var(--text-mute);line-height:1.6}
.view-link{display:inline-block;margin-top:.9rem;padding:.55rem 1.2rem;background:var(--gold);color:#1a1208;border-radius:8px;font-size:.82rem;font-weight:600;text-decoration:none}
.view-link:hover{background:var(--gold-bright)}

.stack{display:flex;flex-direction:column;gap:1.2rem;padding-bottom:3rem}

@media(max-width:480px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-in">
    <div class="mark">Maison <b>d'Élites</b></div>
    <div class="top-links" id="topLinks" style="display:none">
      <a href="/dashboard" target="_blank">Live dashboard ↗</a>
      <a href="#" id="lockBtn">Lock</a>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- Auth gate -->
  <div id="gate" class="gate" style="display:none">
    <div class="gate-title display">Campaign editor</div>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="err-msg" id="gateErr"></div>
    <button class="btn" id="unlockBtn">Unlock</button>
  </div>

  <!-- App -->
  <div id="app" style="display:none">
    <div class="stack">

      <!-- Campaign settings -->
      <div class="card">
        <div class="card-title">Campaign settings</div>
        <div class="fields">
          <div class="field">
            <label>Artist / client</label>
            <input id="s-client" type="text" value="Itzdanielmichael" placeholder="Artist name">
          </div>
          <div class="field">
            <label>Campaign title</label>
            <input id="s-campaign" type="text" value="Need You · Please Stay" placeholder="Campaign title">
          </div>
          <div class="field">
            <label>Budget ($)</label>
            <input id="s-budget" type="number" min="0" value="1000" placeholder="1000">
          </div>
          <div class="field">
            <label>CPM ($ per 1k views)</label>
            <input id="s-cpm" type="number" min="0" step="0.01" value="0.50" placeholder="0.50">
          </div>
          <div class="field full">
            <label>Guarantee floor (views, optional)</label>
            <input id="s-floor" type="number" min="0" placeholder="e.g. 1500000 — leave blank if none">
          </div>
        </div>
      </div>

      <!-- Upload zone -->
      <div class="zone" id="zone">
        <input type="file" id="fileInput" accept=".csv,text/csv,text/plain">
        <div class="zone-icon">↑</div>
        <div class="zone-head display">Drop your CSV here</div>
        <div class="zone-sub">or click to browse · exports from any tracker work</div>
        <div class="zone-name" id="fileName"></div>
      </div>

      <!-- Result -->
      <div class="status" id="statusBox">
        <div class="status-head" id="statusHead"></div>
        <div class="status-body" id="statusBody"></div>
        <a class="view-link" id="dashLink" href="/dashboard" target="_blank" style="display:none">View live dashboard ↗</a>
      </div>

    </div>
  </div>

</div>

<script>
const $ = (s) => document.querySelector(s);
const pw = () => sessionStorage.getItem('mde_pw') || '';
const setPw = (v) => sessionStorage.setItem('mde_pw', v);
const clearPw = () => sessionStorage.removeItem('mde_pw');
const authHdr = () => ({ 'Authorization': 'Bearer ' + pw(), 'content-type': 'application/json' });

function showGate(msg) {
  $('#gate').style.display = '';
  $('#app').style.display = 'none';
  $('#topLinks').style.display = 'none';
  $('#gateErr').textContent = msg || '';
  setTimeout(() => $('#pw').focus(), 50);
}

function showApp() {
  $('#gate').style.display = 'none';
  $('#app').style.display = '';
  $('#topLinks').style.display = '';
}

function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(Math.round(n));
}

function setStatus(kind, head, body, showLink) {
  const box = $('#statusBox');
  box.className = 'status ' + kind;
  box.style.display = '';
  $('#statusHead').textContent = head;
  $('#statusBody').textContent = body;
  $('#dashLink').style.display = showLink ? '' : 'none';
}

async function uploadFile(file) {
  if (!file) return;
  $('#fileName').textContent = file.name;
  setStatus('ok', 'Uploading…', '', false);

  const csv = await file.text();
  const meta = {
    csv,
    client: $('#s-client').value.trim() || 'Itzdanielmichael',
    campaign: $('#s-campaign').value.trim() || 'Need You · Please Stay',
    budgetTotal: Number($('#s-budget').value) || 1000,
    cpm: Number($('#s-cpm').value) || 0,
    guaranteeFloor: Number($('#s-floor').value) || 0,
    tagline: 'Live distribution across our creator network',
  };

  try {
    const res = await fetch('/api/campaign/import', {
      method: 'POST',
      headers: authHdr(),
      body: JSON.stringify(meta),
    });
    if (res.status === 401) { clearPw(); showGate('Session expired — unlock again.'); return; }
    const j = await res.json();
    if (!res.ok) {
      setStatus('err', 'Upload failed', j.error || 'Unknown error — check your CSV format.', false);
      return;
    }
    const views = fmt(j.views || 0);
    const clips = j.imported || 0;
    const spent = j.budgetSpent != null ? ' · $' + (j.budgetSpent).toFixed(2) + ' deployed' : '';
    setStatus('ok',
      '✓ Dashboard updated',
      clips + ' clips · ' + views + ' views' + spent,
      true
    );
  } catch (e) {
    setStatus('err', 'Upload failed', e.message || String(e), false);
  }
}

// File input
$('#fileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
});

// Drag and drop
const zone = $('#zone');
zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('over'));
zone.addEventListener('drop', (e) => {
  e.preventDefault();
  zone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) uploadFile(f);
});

// Auth
$('#unlockBtn').addEventListener('click', async () => {
  const v = $('#pw').value.trim();
  if (!v) return;
  setPw(v);
  $('#pw').value = '';
  // Quick auth check
  try {
    const r = await fetch('/api/campaign', { headers: { 'Authorization': 'Bearer ' + v }, cache: 'no-store' });
    if (r.status === 401) { clearPw(); showGate('Wrong password.'); return; }
    showApp();
  } catch (e) { showGate('Network error.'); }
});
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#unlockBtn').click(); });
$('#lockBtn').addEventListener('click', (e) => { e.preventDefault(); clearPw(); showGate('Locked.'); });

// Auto-unlock if already have pw
if (pw()) {
  fetch('/api/campaign', { headers: { 'Authorization': 'Bearer ' + pw() }, cache: 'no-store' })
    .then(r => { if (r.status === 401) { clearPw(); showGate(); } else showApp(); })
    .catch(() => showGate('Network error.'));
} else {
  showGate();
}
</script>
</body>
</html>
