<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maison d'Élites · Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0d0d0f; --gold:#a88a4f; --gold-light:#c7a867; --cream:#e8e3d6; --mute:#9b9484; --hair:rgba(232,227,214,0.12); }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Archivo',sans-serif;background:var(--ink);color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;-webkit-font-smoothing:antialiased}
  .wrap{max-width:32rem}
  .mark{font-family:'EB Garamond',serif;font-size:1.4rem;letter-spacing:.03em;margin-bottom:2.4rem}
  .mark b{color:var(--gold-light);font-weight:500}
  .ring{width:96px;height:96px;border:1px solid rgba(199,168,103,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.8rem;font-family:'EB Garamond',serif;font-size:2rem;color:var(--gold-light);box-shadow:0 0 0 7px rgba(199,168,103,.05)}
  h1{font-family:'EB Garamond',serif;font-weight:400;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.01em;margin-bottom:.9rem}
  h1 i{font-style:italic;color:var(--gold-light)}
  p{color:var(--mute);font-weight:300;line-height:1.6;font-size:.98rem}
  .foot{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid var(--hair);font-size:.78rem;color:var(--mute);letter-spacing:.04em}
  a{color:var(--gold-light);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Maison <b>d'Élites</b></div>
    <div class="ring">M</div>
    <h1>Private campaign <i>dashboards</i></h1>
    <p>Each client's live report lives at its own private address. If you're a client, use the link shared with you.</p>
    <div class="foot">Maison d'Élites · <a href="https://hello.maisondelites.com">hello.maisondelites.com</a></div>
  </div>
</body>
</html>
